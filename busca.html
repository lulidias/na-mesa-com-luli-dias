<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Busca Global — Luli Dias · Restaurants &amp; Hotels</title>
<meta property="og:title" content="Busca Global — Luli Dias · Restaurants &amp; Hotels">
<meta property="og:url" content="https://lulidias.com/busca.html">
<meta property="og:image" content="https://lulidias.com/og-image.jpg">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Montserrat:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F3EE;--white:#FFF;--ink:#1A1A1A;--ink-lt:#5A5A5A;--ink-xs:#9A9A9A;
  --gold:#B8922A;--gold-lt:#D4AE5C;--gold-bg:#FAF5EB;--border:#E8E0D5;--card-bg:#FFF;
}
html,body{min-height:100%}
body{background:var(--cream);color:var(--ink);font-family:'Montserrat',sans-serif;padding-top:68px}
/* ── Top nav ── */
.top-nav{background:var(--white);border-bottom:1px solid var(--border);padding:8px 24px;display:flex;align-items:center;gap:14px;position:fixed;top:0;left:0;right:0;z-index:1000;box-shadow:0 1px 8px rgba(0,0,0,.04);min-height:60px}
.back-link{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);text-decoration:none;font-weight:600;background:var(--gold-bg);border:1px solid var(--gold-lt);padding:6px 12px;border-radius:24px;flex-shrink:0;transition:all .2s}
.back-link:hover{background:var(--gold);color:#fff;border-color:var(--gold)}
.nav-brand{font-family:'Playfair Display',serif;font-size:18px;letter-spacing:5px;color:var(--ink);text-decoration:none;font-weight:400}
.nav-brand:hover{color:var(--gold)}
.nav-title{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-lt);font-weight:500;margin-left:auto}
@media(max-width:600px){.nav-brand{display:none}.nav-title{margin-left:0}}
/* ── Search bar ── */
.search-wrap{max-width:760px;margin:0 auto;padding:40px 24px 20px}
.search-label{font-family:'Playfair Display',serif;font-size:28px;font-weight:400;letter-spacing:2px;color:var(--ink);text-align:center;margin-bottom:28px}
.search-label span{color:var(--gold)}
.search-box{display:flex;align-items:center;gap:12px;background:var(--white);border:1.5px solid var(--border);border-radius:40px;padding:0 20px;transition:border-color .2s;box-shadow:0 2px 12px rgba(0,0,0,.04)}
.search-box:focus-within{border-color:var(--gold)}
.search-box svg{flex-shrink:0;color:var(--ink-xs)}
.search-box input{flex:1;border:none;background:none;font-family:'Montserrat',sans-serif;font-size:15px;color:var(--ink);padding:16px 0;outline:none;min-width:0}
.search-box input::placeholder{color:var(--ink-xs)}
.search-clear{background:none;border:none;color:var(--ink-xs);cursor:pointer;font-size:18px;padding:4px;display:none}
.search-clear.vis{display:block}
/* ── Filters ── */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;justify-content:center}
.filter-btn{font-size:9px;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--border);background:var(--white);color:var(--ink-lt);padding:6px 14px;border-radius:20px;cursor:pointer;font-family:'Montserrat',sans-serif;font-weight:500;transition:all .2s}
.filter-btn:hover,.filter-btn.on{border-color:var(--gold);color:var(--gold);background:var(--gold-bg)}
/* ── Stats / hint ── */
.hint{text-align:center;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-xs);margin-top:8px}
/* ── Results ── */
.results{max-width:760px;margin:0 auto;padding:0 24px 60px}
.country-group{margin-top:32px}
.country-hdr{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.country-hdr::before,.country-hdr::after{content:'';flex:1;height:1px;background:var(--border)}
.country-hdr-inner{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--ink-lt);white-space:nowrap;display:flex;align-items:center;gap:7px}
/* ── Result card ── */
.r-card{background:var(--white);border:1px solid var(--border);border-radius:4px;padding:16px 18px;display:flex;align-items:flex-start;gap:14px;cursor:pointer;transition:all .2s;text-decoration:none;color:inherit;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.r-card:hover{border-color:var(--gold-lt);box-shadow:0 4px 16px rgba(0,0,0,.08);transform:translateY(-1px)}
.r-flag{font-size:22px;flex-shrink:0;line-height:1;margin-top:2px}
.r-body{flex:1;min-width:0}
.r-name{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--ink);margin-bottom:4px;line-height:1.3}
.r-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ink-xs)}
.r-city{color:var(--ink-lt)}
.r-cuisine{color:var(--ink-xs)}
.r-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.badge-m{font-size:8px;letter-spacing:1px;padding:2px 8px;border-radius:20px;font-weight:600}
.bm3{background:#FFF0F0;color:#C0001F}.bm2{background:#FFF0F0;color:#C0001F}.bm1{background:#FFF5F5;color:#C0001F}
.bbib{background:#FFF5EE;color:#E8700A}.bh{background:#F5F0FF;color:#7B5EA7}
.r-arrow{color:var(--gold);font-size:18px;flex-shrink:0;align-self:center;opacity:.5}
.r-card:hover .r-arrow{opacity:1}
/* ── Empty / loading ── */
.empty{text-align:center;padding:60px 24px;color:var(--ink-xs)}
.empty-icon{font-size:40px;margin-bottom:16px}
.empty-msg{font-size:12px;letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>

<nav class="top-nav">
  <a href="index.html" class="back-link" onclick="if(document.referrer&&document.referrer.includes(location.host)){event.preventDefault();history.back();return false;}">← Voltar</a>
  <a href="index.html" class="nav-brand">LULI DIAS</a>
  <span class="nav-title">Busca Global</span>
</nav>

<div class="search-wrap">
  <div class="search-label">Buscar em <span>todos os guias</span></div>
  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="q" type="search" placeholder="Restaurante, culinária, cidade, país…" autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="search-clear" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>
  <div class="filters" id="filters">
    <button class="filter-btn on" data-type="all" onclick="setType(this)">✦ Todos</button>
    <button class="filter-btn" data-type="r" onclick="setType(this)">🍽 Restaurantes</button>
    <button class="filter-btn" data-type="h" onclick="setType(this)">🛏 Hotéis</button>
    <button class="filter-btn" data-type="m" onclick="setType(this)">★ Michelin</button>
  </div>
  <div class="hint" id="hint">1 144 lugares em 40 guias</div>
</div>

<div class="results" id="results"></div>

<script>
var DATA = [];
var activeType = 'all';

function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
// mesmo slug dos guias (nórdico-aware) → casa com id="card-SLUG" p/ abrir o modal
function slug(n){ return (n||'').toLowerCase().replace(/æ/g,'ae').replace(/ø/g,'o').replace(/å/g,'a').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); }

var ML = { m3:'★★★', m2:'★★', m1:'★', bib:'Bib Gourmand', rec:'Recomendado' };

function badgesHTML(e){
  var b = '';
  if(e.t==='h'&&e.k){ var kl=['','⚿','⚿⚿','⚿⚿⚿']; b+='<span class="badge-m bh">'+kl[e.k]+' Chaves</span>'; }
  if(e.t==='h'&&e.s){ b+='<span class="badge-m bh">'+'★'.repeat(e.s)+'</span>'; }
  if(e.m==='m3')b+='<span class="badge-m bm3">★★★ Michelin</span>';
  else if(e.m==='m2')b+='<span class="badge-m bm2">★★ Michelin</span>';
  else if(e.m==='m1')b+='<span class="badge-m bm1">★ Michelin</span>';
  else if(e.m==='bib')b+='<span class="badge-m bbib">Bib Gourmand</span>';
  return b;
}

function search(){
  var raw = document.getElementById('q').value.trim();
  var q   = norm(raw);
  var res = document.getElementById('results');
  var clearBtn = document.getElementById('clearBtn');
  var hint = document.getElementById('hint');
  clearBtn.classList.toggle('vis', q.length > 0);

  if(!q){
    res.innerHTML = '';
    hint.textContent = (DATA.length ? DATA.length + ' lugares no guia' : '');
    return;
  }

  // tokens: cada palavra tem de aparecer (AND), em qualquer ordem, em nome/cozinha/cidade/país
  var toks = q.split(/\s+/).filter(Boolean);
  var scored = [];
  for(var i=0;i<DATA.length;i++){
    var e = DATA[i];
    if(activeType==='r'&&e.t==='h') continue;
    if(activeType==='h'&&e.t!=='h') continue;
    if(activeType==='m'&&!e.m) continue;
    var en = e._n || (e._n = norm(e.n));
    var es = e._s || (e._s = en + ' ' + norm(e.q) + ' ' + norm(e.city) + ' ' + norm(e.country));
    var ok = true;
    for(var t=0;t<toks.length;t++){ if(es.indexOf(toks[t]) < 0){ ok = false; break; } }
    if(!ok) continue;
    // relevância: nome exato > começa com > contém > tokens no nome
    var sc = 0;
    if(en === q) sc += 1000; else if(en.indexOf(q) === 0) sc += 500; else if(en.indexOf(q) >= 0) sc += 250;
    for(var t2=0;t2<toks.length;t2++){ sc += (en.indexOf(toks[t2]) >= 0) ? 20 : 1; }
    scored.push({ e:e, sc:sc });
  }

  hint.textContent = scored.length + ' resultado' + (scored.length!==1?'s':'') + ' para "' + raw + '"';

  if(!scored.length){
    res.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-msg">Nenhum resultado encontrado</div></div>';
    return;
  }

  scored.sort(function(a,b){ return b.sc - a.sc || a.e.n.localeCompare(b.e.n, 'pt'); });

  // agrupa por país preservando a ordem de relevância
  var order = [], groups = {};
  scored.forEach(function(x){
    var e = x.e;
    if(!groups[e.country]){ groups[e.country] = { flag: e.flag, entries: [] }; order.push(e.country); }
    groups[e.country].entries.push(e);
  });

  var html = '';
  order.forEach(function(country){
    var g = groups[country];
    html += '<div class="country-group">';
    html += '<div class="country-hdr"><div class="country-hdr-inner">' + g.flag + ' ' + country + '</div></div>';
    g.entries.forEach(function(e){
      var stateQ = (e.guide.indexOf('brasil-') === 0 && e.region) ? ('state=' + encodeURIComponent(e.region) + '&') : '';
      var guideUrl = e.guide + '.html?' + stateQ + 'modal=' + slug(e.n);
      var badges    = badgesHTML(e);
      html += '<a class="r-card" href="' + guideUrl + '">' +
        '<div class="r-flag">' + e.flag + '</div>' +
        '<div class="r-body">' +
          '<div class="r-name">' + e.n + '</div>' +
          '<div class="r-meta">' +
            '<span class="r-city">' + e.city + '</span>' +
            (e.q ? '<span>·</span><span class="r-cuisine">' + e.q + '</span>' : '') +
          '</div>' +
          (badges ? '<div class="r-badges">' + badges + '</div>' : '') +
        '</div>' +
        '<span class="r-arrow">→</span>' +
        '</a>';
    });
    html += '</div>';
  });
  res.innerHTML = html;
}

function clearSearch(){
  document.getElementById('q').value = '';
  document.getElementById('clearBtn').classList.remove('vis');
  document.getElementById('results').innerHTML = '';
  document.getElementById('hint').textContent = (DATA.length ? DATA.length + ' lugares no guia' : '');
  document.getElementById('q').focus();
}

function setType(btn){
  activeType = btn.dataset.type;
  document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.toggle('on', b===btn); });
  search();
}

document.getElementById('q').addEventListener('input', search);

// Focus search on load
window.addEventListener('load', function(){
  var inp = document.getElementById('q');
  inp.focus();

  // Pre-fill from URL ?q=
  var qp = new URLSearchParams(location.search).get('q');
  if(qp){ inp.value = qp; }

  // Load data
  fetch('search.json?v=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      DATA = d;
      document.getElementById('hint').textContent = d.length + ' lugares em 40 guias';
      if(qp) search();
    })
    .catch(function(){ document.getElementById('hint').textContent = 'Erro ao carregar dados'; });
});
</script>
</body>
</html>
