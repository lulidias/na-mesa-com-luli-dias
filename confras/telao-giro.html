<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#101F38}
iframe{position:absolute;inset:0;width:100%;height:100%;border:none;opacity:0;transition:opacity 1.2s ease;pointer-events:none}
iframe.on{opacity:1;pointer-events:auto}
.gate{max-width:380px;margin:20vh auto;text-align:center;background:rgba(0,0,0,.25);border:1px solid rgba(212,174,92,.4);padding:48px 40px;color:#F7F3EE;font-family:'Montserrat',sans-serif}
.gate h1{font-family:'Playfair Display',serif;font-weight:400;font-size:22px;margin-top:10px}
.gate .k{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#D4AE5C}
.gate input{width:100%;padding:13px;border:1px solid rgba(212,174,92,.5);background:rgba(255,255,255,.06);color:#F7F3EE;font-family:'Montserrat',sans-serif;text-align:center;margin:18px 0;outline:none}
.gate button{padding:13px 34px;background:#B8922A;border:none;color:#fff;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="k">Telão giratório · As três cenas</div>
  <h1>Confra das Confras</h1>
  <input type="password" id="tok" placeholder="Token de acesso">
  <button onclick="entrar()">Iniciar o show</button>
</div>

<script>
'use strict';
// cenas e duração em segundos — ajustável por URL: ?apuracao=30&votantes=20&carta=45
var P = new URLSearchParams(location.search);
var CENAS = [
  { src: 'telao.html',       dur: Number(P.get('apuracao')) || 22 },
  { src: 'telao-qr.html',    dur: Number(P.get('qr')) || 18 },
  { src: 'telao-carta.html', dur: Number(P.get('carta'))    || 22 },
  { src: 'telao2/',          dur: Number(P.get('votantes')) || 30 },
  { src: 'telao-vitrine.html', dur: Number(P.get('vitrine')) || 22 },
  { src: 'telao-numeros.html', dur: Number(P.get('numeros')) || 22 },
  { src: 'telao-graficos.html', dur: Number(P.get('graficos')) || 28 },
  { src: 'telao-2027.html',  dur: Number(P.get('anoquevem')) || 22 }
];
var atual = -1;

function entrar() {
  var t = document.getElementById('tok').value.trim();
  if (!t) return;
  localStorage.setItem('confras_admin_token', t);
  comeca();
}

function comeca() {
  document.getElementById('gate').classList.add('hidden');
  // dois iframes bastam: telao-carta aparece duas vezes mas é o mesmo documento vivo
  var vistos = {};
  CENAS.forEach(function (c) {
    if (vistos[c.src]) return;
    vistos[c.src] = true;
    var f = document.createElement('iframe');
    f.src = c.src; f.dataset.src = c.src;
    document.body.appendChild(f);
  });
  proxima();
}

var modoRevel = false;
function proxima() {
  if (modoRevel) { setTimeout(proxima, 2000); return; }
  var velho = atual >= 0 ? CENAS[atual].src : null;
  atual = (atual + 1) % CENAS.length;
  var alvo = CENAS[atual].src;
  // sem QR fixo: na cena do QR grande e nas telas brancas só de garrafas (A Mesa, A Vitrine)
  if (window.qrFixo) qrFixo(['telao-qr.html', 'telao-carta.html', 'telao-vitrine.html'].indexOf(alvo) < 0);
  document.querySelectorAll('iframe').forEach(function (f) {
    f.classList.toggle('on', f.dataset.src === alvo);
    // recarrega a cena que acabou de sair: na próxima volta ela entra sempre fresca
    if (velho && f.dataset.src === velho && velho !== alvo) {
      try { f.contentWindow.location.reload(); } catch (e) { f.src = f.dataset.src; }
    }
  });
  setTimeout(proxima, CENAS[atual].dur * 1000);
}

// ── revelação comandada pelo celular: quando o MC avança, as TVs trocam sozinhas
function vigiaRevelacao() {
  var t = localStorage.getItem('confras_admin_token');
  if (!t) return;
  fetch('https://saotncritqxuchsvvnzi.supabase.co/rest/v1/rpc/confras_revelacao_get', {
    method: 'POST',
    headers: { 'apikey': 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5', 'Authorization': 'Bearer sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5', 'Content-Type': 'application/json' },
    body: JSON.stringify({ p_token: t })
  }).then(function (r) { return r.json(); }).then(function (passo) {
    var ativa = Number(passo) >= 1;
    if (ativa && !modoRevel) {
      modoRevel = true;
      if (window.qrFixo) qrFixo(false);
      var f = document.querySelector('iframe[data-src="revelacao.html"]');
      if (!f) {
        f = document.createElement('iframe');
        f.src = 'revelacao.html'; f.dataset.src = 'revelacao.html';
        document.body.appendChild(f);
      }
      document.querySelectorAll('iframe').forEach(function (x) { x.classList.toggle('on', x.dataset.src === 'revelacao.html'); });
    } else if (!ativa && modoRevel) {
      modoRevel = false;
      if (window.qrFixo) qrFixo(true);
      var fr = document.querySelector('iframe[data-src="revelacao.html"]');
      if (fr) fr.classList.remove('on');
      atual = -1;
      // a rotação retoma no próximo tique do proxima()
    }
  }).catch(function () {});
}
setInterval(vigiaRevelacao, 2500);

// tela cheia com um clique/OK do controle da TV
document.addEventListener('click', function () {
  var el = document.documentElement;
  if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(function () {});
});

if (localStorage.getItem('confras_admin_token')) comeca();
document.addEventListener('keydown', function (e) { if (e.key === 'Enter') { var g = document.getElementById('gate'); if (!g.classList.contains('hidden')) entrar(); } });
</script>
<script src="/confras/qr-fixo.js?v=3"></script>
<script src="/confras/tv-remoto.js"></script>
</body>
</html>
