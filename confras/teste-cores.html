<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teste de cores — A Confra das Confras</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#F7F3EE;font-family:'Montserrat',sans-serif}
.lbl{text-align:center;font-size:11px;letter-spacing:4px;text-transform:uppercase;color:#5A5A5A;padding:26px 0 14px;background:#F7F3EE}
.hero{--c1:#7A2A42;--c2:#5C1A2E;--c3:#4A1420;
  background:radial-gradient(120% 120% at 50% -10%,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);
  color:#F7F3EE;text-align:center;padding:64px 24px 58px;position:relative;overflow:hidden}
.hero::after{content:'';position:absolute;inset:14px;border:1px solid rgba(212,174,92,.35);pointer-events:none}
.hk{font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#D4AE5C;margin-bottom:30px}
.emb{margin:0 auto 24px;width:110px;height:110px;display:block}
h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(32px,6vw,56px);letter-spacing:8px;line-height:1.15;text-transform:uppercase}
h1 .a{display:block;font-size:.38em;letter-spacing:12px;color:#D4AE5C;margin-bottom:10px}
.yr{font-family:Didot,'Playfair Display',serif;font-size:19px;letter-spacing:14px;color:#D4AE5C;margin-top:13px}
.tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:rgba(247,243,238,.9);margin:22px auto 0;max-width:520px;line-height:1.5}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:26px 0 0}
.orn .l{height:1px;width:56px;background:linear-gradient(90deg,transparent,#D4AE5C)}
.orn .r{height:1px;width:56px;background:linear-gradient(90deg,#D4AE5C,transparent)}
.orn .d{width:5px;height:5px;background:#D4AE5C;transform:rotate(45deg)}
.preto{--c1:#3A3A3A;--c2:#222222;--c3:#111111}
.verde{--c1:#2A5C42;--c2:#1A4230;--c3:#0F2E20}
.azul{--c1:#2A4468;--c2:#1A2F4E;--c3:#101F38}
</style>
</head>
<body>

<div class="lbl">1 · Bordô (atual)</div>
<div class="hero" id="bordo"></div>
<div class="lbl">2 · Preto</div>
<div class="hero preto"></div>
<div class="lbl">3 · Verde garrafa</div>
<div class="hero verde"></div>
<div class="lbl">4 · Azul profundo</div>
<div class="hero azul"></div>

<script>
var inner =
  '<div class="hk">Recife · Pernambuco · Brasil</div>' +
  '<svg class="emb" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">' +
  '<circle cx="60" cy="60" r="57" stroke="#D4AE5C" stroke-width="1" opacity=".5"/>' +
  '<circle cx="60" cy="60" r="52" stroke="#D4AE5C" stroke-width=".5" opacity=".35"/>' +
  '<g stroke="#D4AE5C" stroke-width="1.4">' +
  '<circle cx="60" cy="38" r="15" fill="rgba(212,174,92,.07)"/>' +
  '<circle cx="81" cy="53" r="15" fill="rgba(212,174,92,.07)"/>' +
  '<circle cx="73" cy="78" r="15" fill="rgba(212,174,92,.07)"/>' +
  '<circle cx="47" cy="78" r="15" fill="rgba(212,174,92,.07)"/>' +
  '<circle cx="39" cy="53" r="15" fill="rgba(212,174,92,.07)"/>' +
  '</g><rect x="57" y="57" width="6" height="6" transform="rotate(45 60 60)" fill="#D4AE5C"/></svg>' +
  '<h1><span class="a">A</span>Confra<br>das Confras</h1>' +
  '<div class="yr">2026</div>' +
  '<p class="tag">O maior encontro de vinhos da história de Pernambuco. Pela primeira vez, as mais importantes confrarias do Recife reunidas em uma única mesa.</p>' +
  '<div class="orn"><span class="l"></span><span class="d"></span><span class="r"></span></div>';
document.querySelectorAll('.hero').forEach(function (h) { h.innerHTML = inner; });
</script>
</body>
</html>
