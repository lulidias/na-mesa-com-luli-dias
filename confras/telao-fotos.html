<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A festa agora — Confra das Confras</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.cdc{text-align:center;padding-top:18px}
.cdc-emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.cdc-nome{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;color:var(--cream)}
.cdc-filete{width:120px;height:1.5px;background:var(--gold-lt);margin:14px auto 12px}
.cdc-cena{font-family:'Montserrat',sans-serif;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.grade{position:absolute;inset:215px 3vw 30px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr;gap:12px}
.grade img{width:100%;height:100%;object-fit:cover;border:1px solid rgba(212,174,92,.5);opacity:0;animation:surge .8s forwards}
@keyframes surge{to{opacity:1}}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="cdc">
  <svg class="cdc-emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
  <div class="cdc-nome">Confra das Confras</div>
  <div class="cdc-filete"></div>
  <div class="cdc-cena">A festa, agora</div>
</div>
<div class="grade" id="grade"></div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var fotos = [], pagina = 0;
function carrega(){
  fetch(SB+'/storage/v1/object/list/confras',{method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({prefix:'live/',limit:60,sortBy:{column:'created_at',order:'desc'}})})
  .then(function(r){return r.json();})
  .then(function(itens){
    fotos=(itens||[]).filter(function(o){return o.name&&/\.(jpe?g|png|webp)$/i.test(o.name);})
      .map(function(o){return SB+'/storage/v1/object/public/confras/live/'+encodeURIComponent(o.name);});
    mostra();
  }).catch(function(){});
}
function mostra(){
  var g=document.getElementById('grade');
  if(!fotos.length){g.innerHTML='';return;}
  var ini=(pagina*6)%fotos.length;
  var lote=[];
  for(var i=0;i<Math.min(6,fotos.length);i++) lote.push(fotos[(ini+i)%fotos.length]);
  g.innerHTML=lote.map(function(u,ix){return '<img src="'+u+'" style="animation-delay:'+(ix*0.12)+'s" loading="eager">';}).join('');
  pagina++;
}
carrega();
setInterval(carrega, 45000);
setInterval(mostra, 8000);
// sem fotos ao vivo, a cena pede para pular
(function(){
  var f=window.frameElement, avisou=false;
  if(!f) return;
  setInterval(function(){
    var on=f.classList.contains('on');
    if(on && !fotos.length){
      if(!avisou){ avisou=true; try{ window.parent.postMessage('cdc-pular','*'); }catch(e){} }
    } else if(!on){ avisou=false; }
  },400);
})();
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<30;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="/confras/qr-fixo.js?v=4"></script>
<script src="/confras/tv-remoto.js"></script>
</body>
</html>
