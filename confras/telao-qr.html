<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cdc{text-align:center;padding-top:0}
.cdc-emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.cdc-nome{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;color:var(--cream)}
.cdc-filete{width:120px;height:1.5px;background:var(--gold-lt);margin:14px auto 12px}
.cdc-cena{font-family:'Montserrat',sans-serif;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.qrbox{background:#fff;border:3px solid var(--gold-lt);padding:30px;margin-top:40px;animation:pulsa 4s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.aponte{font-size:clamp(20px,1.8vw,30px);letter-spacing:8px;text-transform:uppercase;color:var(--cream);margin-top:34px;font-weight:500}
.prazo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,1.9vw,28px);color:var(--gold-lt);margin-top:12px}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="cdc">
  <svg class="cdc-emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
  <div class="cdc-nome">Confra das Confras</div>
  <div class="cdc-filete"></div>
  <div class="cdc-cena">A Grande Votação</div>
</div>
<div class="qrbox"><canvas id="qr"></canvas></div>
<div class="aponte">Aponte a câmera e vote</div>
<div class="prazo">Um voto por categoria — a urna fecha às 16h30</div>
<canvas id="poeira"></canvas>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
'use strict';
new QRious({ element: document.getElementById('qr'), value: 'https://v1.lulidias.com/confras/votar/', size: 430, level: 'M', foreground: '#101F38' });
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<40;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="/confras/qr-fixo.js?v=3" data-sem-qr></script>
<script>document.addEventListener("click",function(){var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){})});</script>
</body>
</html>
