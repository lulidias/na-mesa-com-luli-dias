<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Vitrine — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#fff;font-family:'Montserrat',sans-serif}
.palco{position:absolute;inset:0;background:#fff;padding:14px 16px}
.pagina{position:absolute;inset:14px 16px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:1fr 1fr;gap:4px 10px;visibility:hidden}
.pagina.on{visibility:visible}
.pagina.on{opacity:1}
.pagina.on .card{opacity:0;animation:pop .65s cubic-bezier(.2,.7,.3,1) both}
.pagina.on .card:nth-child(1){animation-delay:0.05s}
.pagina.on .card:nth-child(2){animation-delay:0.10s}
.pagina.on .card:nth-child(3){animation-delay:0.15s}
.pagina.on .card:nth-child(4){animation-delay:0.20s}
.pagina.on .card:nth-child(5){animation-delay:0.25s}
.pagina.on .card:nth-child(6){animation-delay:0.30s}
.pagina.on .card:nth-child(7){animation-delay:0.35s}
.pagina.on .card:nth-child(8){animation-delay:0.40s}
.pagina.on .card:nth-child(9){animation-delay:0.45s}
.pagina.on .card:nth-child(10){animation-delay:0.50s}
.pagina.on .card:nth-child(11){animation-delay:0.55s}
.pagina.on .card:nth-child(12){animation-delay:0.60s}
.pagina.on .card:nth-child(13){animation-delay:0.65s}
.pagina.on .card:nth-child(14){animation-delay:0.70s}
.pagina.on .card:nth-child(15){animation-delay:0.75s}
.pagina.on .card:nth-child(16){animation-delay:0.80s}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.card{display:flex;flex-direction:column;min-height:0}
.fig{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.fig img{max-height:100%;max-width:100%;object-fit:contain}
.nm{font-family:'Playfair Display',Georgia,serif;font-size:clamp(11px,.85vw,15px);color:var(--wine);text-align:center;line-height:1.15;margin-top:4px;height:2.3em;overflow:hidden}
.nm .sf{font-family:Didot,'Playfair Display',serif;color:var(--gold);white-space:nowrap}
.semfoto{margin:0 auto;opacity:.8}
</style>
</head>
<body>
  <h1>A Vitrine</h1>
</div>
<div class="palco" id="palco"></div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var POR_PAGINA = 16;
var COM_NOMES = new URLSearchParams(location.search).has('nomes');
var TROCA = Number(new URLSearchParams(location.search).get('t')) || 7; // segundos por página
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var GARRAFA_SVG='<svg class="semfoto" viewBox="0 0 60 200" width="54" height="180"><path d="M24 8h12v38c0 10 10 16 10 30v108a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8V76c0-14 10-20 10-30z" fill="none" stroke="#B8922A" stroke-width="2.5"/><rect x="17" y="104" width="26" height="44" fill="none" stroke="#D4AE5C" stroke-width="1.5"/></svg>';

fetch(SB+'/rest/v1/confras_vinhos_publico?select=vinho,safra,formato,foto_url&order=vinho',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
.then(function(r){return r.json();})
.then(function(vinhos){
  vinhos=vinhos||[];
  var palco=document.getElementById('palco');
  var paginas=[];
  for(var i=0;i<vinhos.length;i+=POR_PAGINA) paginas.push(vinhos.slice(i,i+POR_PAGINA));
  var ultima=paginas[paginas.length-1];
  var k=0;
  while(ultima && ultima.length<POR_PAGINA && vinhos.length) ultima.push(vinhos[k++ % vinhos.length]);
  paginas.forEach(function(pg,ix){
    var el=document.createElement('div'); el.className='pagina'; el.id='pg'+ix;
    el.innerHTML=pg.map(function(g){
      return '<div class="card"><div class="fig">'+
        (g.foto_url?'<img src="'+esc(g.foto_url)+'">':GARRAFA_SVG)+
        '</div>'+(COM_NOMES?'<div class="nm">'+esc(g.vinho)+(g.safra?' <span class="sf">'+esc(g.safra)+'</span>':'')+'</div>':'')+
      '</div>';
    }).join('');
    palco.appendChild(el);
  });
  var atual=0;
  document.getElementById('pg0').classList.add('on');
  if(paginas.length>1) setInterval(function(){
    document.getElementById('pg'+atual).classList.remove('on');
    atual=(atual+1)%paginas.length;
    document.getElementById('pg'+atual).classList.add('on');
  },TROCA*1000);
});

})();
</script>
</body>
</html>
