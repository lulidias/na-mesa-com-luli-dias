<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Mesa — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.top{text-align:center;padding-top:34px}
.top .k{font-size:12px;letter-spacing:6px;text-transform:uppercase;color:var(--gold-lt)}
.top h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(28px,3.6vw,46px);letter-spacing:6px;text-transform:uppercase;margin-top:8px}
.palco{position:absolute;inset:150px 0 70px;display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);padding:0 60px}
.cena{display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);opacity:0;transform:translateY(24px);transition:opacity 1.1s ease,transform 1.1s ease;position:absolute;inset:0}
.cena.on{opacity:1;transform:translateY(0)}
.foto{background:#fff;padding:34px 44px;border:2px solid var(--gold-lt);display:flex;align-items:center;justify-content:center;height:min(62vh,560px)}
.foto img{max-height:100%;max-width:300px;display:block}
.info{max-width:46vw;text-align:left}
.info .tipo{font-size:14px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-lt)}
.info .nome{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(40px,4.6vw,74px);line-height:1.12;margin-top:14px}
.info .safra{font-family:Didot,'Playfair Display',serif;font-size:clamp(28px,3vw,46px);color:var(--gold-lt);margin-top:4px}
.info .fmt{display:inline-block;border:2px solid rgba(212,174,92,.85);color:var(--gold-lt);font-size:14px;letter-spacing:3px;text-transform:uppercase;padding:10px 22px;margin-top:22px}
.info .quem{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,1.9vw,26px);color:rgba(247,243,238,.92);margin-top:26px}
.rodape{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:17px;color:rgba(247,243,238,.75)}
.sem-foto{font-family:'Playfair Display',serif;font-size:30px;color:var(--wine);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="top">
  <div class="k">Confra das Confras · 2026</div>
  <h1>A Mesa</h1>
</div>
<div class="palco">
  <div class="cena" id="c0"></div>
  <div class="cena" id="c1"></div>
</div>
<div class="rodape" id="rodape">Grandes vinhos, grandes garrafas, grandes amigos.</div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguai': '🇺🇾', 'Estados Unidos': '🇺🇸', 'Alemanha': '🇩🇪' };
var DUR = Number(new URLSearchParams(location.search).get('t')) || 8;   // segundos por garrafa
var vinhos = [], idx = 0, ativa = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function embaralha(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function montaCena(el, g) {
  el.innerHTML =
    '<div class="foto">' + (g.foto_url ? '<img src="' + esc(g.foto_url) + '">' : '<div class="sem-foto">🍷</div>') + '</div>' +
    '<div class="info">' +
      '<div class="tipo">' + esc(g.tipo) + ' · ' + (FLAGS[g.pais] || '') + ' ' + esc(g.pais || '') + '</div>' +
      '<div class="nome">' + esc(g.vinho) + '</div>' +
      (g.safra ? '<div class="safra">' + esc(g.safra) + '</div>' : '') +
      '<div class="fmt">' + esc(g.formato) + ' · ' + esc(String(g.litros).replace('.', ',')) + ' L</div>' +
      '<div class="quem">Trazido por ' + esc((g.membros || []).join(', ')) + '</div>' +
    '</div>';
}

function troca() {
  if (!vinhos.length) return;
  var atual = document.getElementById('c' + ativa);
  var prox = document.getElementById('c' + (1 - ativa));
  montaCena(prox, vinhos[idx]);
  atual.classList.remove('on');
  // pequena espera para o crossfade respirar
  setTimeout(function () { prox.classList.add('on'); }, 350);
  ativa = 1 - ativa;
  idx = (idx + 1) % vinhos.length;
  if (idx === 0) embaralha(vinhos);
}

fetch(SB + '/rest/v1/confras_vinhos_publico?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } })
  .then(function (r) { return r.json(); })
  .then(function (rows) {
    vinhos = embaralha(rows || []);
    var litros = 0, paises = {};
    vinhos.forEach(function (g) { litros += Number(g.litros) * (Math.min((g.membros || []).length, g.vagas || 1) / Math.max(1, g.vagas || 1)); if (g.pais) paises[g.pais] = true; });
    document.getElementById('rodape').textContent =
      vinhos.length + ' garrafas · ' + (Math.round(litros * 10) / 10).toLocaleString('pt-BR') + ' litros · ' +
      Object.keys(paises).length + ' países — todas com no mínimo 1,5 litro';
    troca();
    setInterval(troca, DUR * 1000);
  });
</script>
</body>
</html>
