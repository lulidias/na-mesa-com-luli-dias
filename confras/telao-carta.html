<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Mesa — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#fff;color:var(--wine);font-family:'Montserrat',sans-serif}
.top{text-align:center;padding-top:22px}
.emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.top .k{font-size:clamp(20px,1.6vw,30px);letter-spacing:9px;text-transform:uppercase;color:var(--gold-lt)}
.top h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;margin-top:0;color:var(--wine)}
.palco{position:absolute;inset:180px 0 70px;display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);padding:0 60px}
.cena{display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);opacity:0;transition:opacity .9s ease;position:absolute;inset:0}
.cena.on{opacity:1}
.cena.on .foto{display:flex;align-items:center;justify-content:center;height:min(64vh,580px)}
.cena.on .info>*{opacity:0;animation:entraItem .9s cubic-bezier(.2,.7,.3,1) both}
.cena.on .info>*:nth-child(1){animation-delay:.35s}
.cena.on .info>*:nth-child(2){animation-delay:.6s}
.cena.on .info>*:nth-child(3){animation-delay:.85s}
.cena.on .info>*:nth-child(4){animation-delay:1.1s}
.cena.on .info>*:nth-child(5){animation-delay:1.35s}
@keyframes entraFoto{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes entraItem{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
.foto{display:flex;align-items:center;justify-content:center;height:min(64vh,580px)}
.foto img{max-height:100%;max-width:340px;display:block;animation:kenburns 10s linear both}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
#progresso{display:none}
.info{max-width:46vw;text-align:left;height:min(62vh,560px);display:flex;flex-direction:column;justify-content:center}
.info .tipo{font-size:17px;letter-spacing:5px;text-transform:uppercase;color:var(--gold)}
.info .nome{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(40px,4.6vw,74px);line-height:1.12;margin-top:14px;color:var(--wine)}
.info .safra{font-family:Didot,'Playfair Display',serif;font-size:clamp(28px,3vw,46px);color:var(--gold);margin-top:4px}
.info .fmt{display:inline-block;border:2px solid var(--gold);color:var(--wine);font-size:16px;letter-spacing:3px;text-transform:uppercase;padding:10px 22px;margin-top:22px;background:#FBF6EC}
.info .quem{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(42px,4.4vw,62px);color:var(--wine);margin-top:26px}
.confs-mini{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cm{background:#fff;border:1px solid rgba(184,146,42,.6);height:54px;width:88px;display:flex;align-items:center;justify-content:center;padding:6px}
.cm img{max-height:42px;max-width:72px}
.sem-foto-svg{display:block;margin:0 auto;opacity:.75}
</style>
</head>
<body>
<div class="top">
  <svg class="emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/>
    <g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)">
      <circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/>
      <circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/>
    </g>
    <path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/>
  </svg>
  <h1>Confra das Confras</h1>
</div>
<div class="palco">
  <div class="cena" id="c0"></div>
  <div class="cena" id="c1"></div>
</div>
<div id="progresso"></div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguai': '🇺🇾', 'Estados Unidos': '🇺🇸', 'Alemanha': '🇩🇪' };
var LOGOS = { 'commanderie': 'logos/commanderie.png', 'porquinho': 'logos/porquinho.png', 'wine-lovers': 'logos/wine-lovers-recife.png', 'confra-wine': 'logos/confra-wine-recife.png', 'over20': 'logos/over20.svg' };
var confsPessoa = {};
var DUR = Number(new URLSearchParams(location.search).get('t')) || 8;   // segundos por garrafa
var vinhos = [], idx = 0, ativa = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function embaralha(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function montaCena(el, g) {
  el.innerHTML =
    '<div class="foto">' + (g.foto_url ? '<img src="' + esc(g.foto_url) + '">' : '<svg class="sem-foto-svg" viewBox="0 0 60 200" width="90" height="300"><path d="M24 8h12v38c0 10 10 16 10 30v108a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8V76c0-14 10-20 10-30z" fill="none" stroke="#B8922A" stroke-width="2.5"/><rect x="17" y="104" width="26" height="44" fill="none" stroke="#D4AE5C" stroke-width="1.5"/></svg>') + '</div>' +
    '<div class="info">' +
      '<div class="tipo">' + esc(g.tipo) + ' · ' + (FLAGS[g.pais] || '') + ' ' + esc(g.pais || '') + '</div>' +
      '<div class="nome">' + esc(g.vinho) + '</div>' +
      (g.safra ? '<div class="safra">' + esc(g.safra) + '</div>' : '') +
      '<div class="fmt">' + esc(g.formato) + (/litro/i.test(g.formato) ? '' : ' · ' + esc(String(g.litros).replace('.', ',')) + ' L') + '</div>' +
      '<div class="quem">' + esc((g.membros || []).join(' · ')) + '</div>' +
      (function () {
        var slugs = {}, ordem = [];
        (g.membros || []).forEach(function (n) {
          (confsPessoa[n] || []).forEach(function (sl) { if (!slugs[sl]) { slugs[sl] = true; ordem.push(sl); } });
        });
        return ordem.length ? '<div class="confs-mini">' + ordem.map(function (sl) {
          return LOGOS[sl] ? '<span class="cm"><img src="' + LOGOS[sl] + '"></span>' : '';
        }).join('') + '</div>' : '';
      })() +
    '</div>';
}

function progresso() {
  var p = document.getElementById('progresso');
  p.style.transition = 'none'; p.style.width = '0';
  void p.offsetWidth;
  p.style.transition = 'width ' + DUR + 's linear'; p.style.width = '100%';
}

function troca() {
  if (!vinhos.length) return;
  progresso();
  var atual = document.getElementById('c' + ativa);
  var prox = document.getElementById('c' + (1 - ativa));
  montaCena(prox, vinhos[idx]);
  atual.classList.remove('on');
  // pequena espera para o crossfade respirar
  setTimeout(function () { prox.classList.add('on'); }, 350);
  ativa = 1 - ativa;
  idx = (idx + 1) % vinhos.length;
  if (idx === 0) embaralha(vinhos);
}

var assinatura = '';
var primeira = true;
function carregaDados() {
  Promise.all([
    fetch(SB + '/rest/v1/confras_vinhos_publico?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); }),
    fetch(SB + '/rest/v1/confras_confirmados?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); })
  ]).then(function (res) {
    (res[1] || []).forEach(function (p) { confsPessoa[p.nome] = p.confrarias || []; });
    var rows = res[0] || [];
    var a = JSON.stringify(rows);
    if (a !== assinatura) {
      assinatura = a;
      vinhos = embaralha(rows);
      if (idx >= vinhos.length) idx = 0;
    }
    if (primeira) { primeira = false; troca(); setInterval(troca, DUR * 1000); }
  });
}
carregaDados();
setInterval(carregaDados, 120000);
</script>
<script src="/confras/qr-fixo.js?v=3" data-sem-qr></script>
</body>
</html>
