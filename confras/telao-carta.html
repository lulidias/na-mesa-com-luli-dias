<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Mesa — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.top{text-align:center;padding-top:34px}
.top .k{font-size:14px;letter-spacing:6px;text-transform:uppercase;color:var(--gold-lt)}
.top h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(28px,3.6vw,46px);letter-spacing:6px;text-transform:uppercase;margin-top:8px}
.palco{position:absolute;inset:150px 0 70px;display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);padding:0 60px}
.cena{display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);opacity:0;transition:opacity .9s ease;position:absolute;inset:0}
.cena.on{opacity:1}
.cena.on .foto{animation:entraFoto 1.1s cubic-bezier(.2,.7,.3,1) both}
.cena.on .info>*{opacity:0;animation:entraItem .9s cubic-bezier(.2,.7,.3,1) both}
.cena.on .info>*:nth-child(1){animation-delay:.35s}
.cena.on .info>*:nth-child(2){animation-delay:.6s}
.cena.on .info>*:nth-child(3){animation-delay:.85s}
.cena.on .info>*:nth-child(4){animation-delay:1.1s}
.cena.on .info>*:nth-child(5){animation-delay:1.35s}
@keyframes entraFoto{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes entraItem{from{opacity:0;transform:translateX(44px)}to{opacity:1;transform:none}}
.foto{background:#fff;padding:34px 44px;border:2px solid var(--gold-lt);display:flex;align-items:center;justify-content:center;height:min(62vh,560px);overflow:hidden;box-shadow:0 0 90px rgba(212,174,92,.18)}
.foto img{max-height:100%;max-width:300px;display:block;animation:kenburns 10s linear both}
@keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.07)}}
#poeira{position:fixed;inset:0;pointer-events:none}
#progresso{position:fixed;bottom:0;left:0;height:3px;background:linear-gradient(90deg,var(--gold),var(--gold-lt));width:0}
.info{max-width:46vw;text-align:left}
.info .tipo{font-size:17px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-lt)}
.info .nome{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(40px,4.6vw,74px);line-height:1.12;margin-top:14px}
.info .safra{font-family:Didot,'Playfair Display',serif;font-size:clamp(28px,3vw,46px);color:var(--gold-lt);margin-top:4px}
.info .fmt{display:inline-block;border:2px solid rgba(212,174,92,.85);color:var(--gold-lt);font-size:16px;letter-spacing:3px;text-transform:uppercase;padding:10px 22px;margin-top:22px}
.info .quem{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.1vw,28px);color:rgba(247,243,238,.92);margin-top:26px}
.confs-mini{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.cm{background:#fff;border:1px solid rgba(212,174,92,.6);height:54px;width:88px;display:flex;align-items:center;justify-content:center;padding:6px}
.cm img{max-height:42px;max-width:72px}
.rodape{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:rgba(247,243,238,.75)}
.sem-foto{font-family:'Playfair Display',serif;font-size:30px;color:var(--wine);text-align:center;padding:40px}
</style>
</head>
<body>
<div class="top">
  <div class="k">Confra das Confras · 2026</div>
  <h1>A Mesa</h1>
</div>
<div class="palco">
  <div class="cena" id="c0"></div>
  <div class="cena" id="c1"></div>
</div>
<canvas id="poeira"></canvas>
<div class="rodape" id="rodape">Grandes vinhos, grandes garrafas, grandes amigos.</div>
<div id="progresso"></div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguai': '🇺🇾', 'Estados Unidos': '🇺🇸', 'Alemanha': '🇩🇪' };
var LOGOS = { 'commanderie': 'logos/commanderie.png', 'porquinho': 'logos/porquinho.png', 'wine-lovers': 'logos/wine-lovers-recife.png', 'confra-wine': 'logos/confra-wine-recife.png', 'over20': 'logos/over20.svg' };
var confsPessoa = {};
var DUR = Number(new URLSearchParams(location.search).get('t')) || 8;   // segundos por garrafa
var vinhos = [], idx = 0, ativa = 0;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

function embaralha(a) {
  for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

function montaCena(el, g) {
  el.innerHTML =
    '<div class="foto">' + (g.foto_url ? '<img src="' + esc(g.foto_url) + '">' : '<div class="sem-foto">🍷</div>') + '</div>' +
    '<div class="info">' +
      '<div class="tipo">' + esc(g.tipo) + ' · ' + (FLAGS[g.pais] || '') + ' ' + esc(g.pais || '') + '</div>' +
      '<div class="nome">' + esc(g.vinho) + '</div>' +
      (g.safra ? '<div class="safra">' + esc(g.safra) + '</div>' : '') +
      '<div class="fmt">' + esc(g.formato) + (/litro/i.test(g.formato) ? '' : ' · ' + esc(String(g.litros).replace('.', ',')) + ' L') + '</div>' +
      '<div class="quem">' + esc((g.membros || []).join(' · ')) + '</div>' +
      (function () {
        var slugs = {}, ordem = [];
        (g.membros || []).forEach(function (n) {
          (confsPessoa[n] || []).forEach(function (sl) { if (!slugs[sl]) { slugs[sl] = true; ordem.push(sl); } });
        });
        return ordem.length ? '<div class="confs-mini">' + ordem.map(function (sl) {
          return LOGOS[sl] ? '<span class="cm"><img src="' + LOGOS[sl] + '"></span>' : '';
        }).join('') + '</div>' : '';
      })() +
    '</div>';
}

function progresso() {
  var p = document.getElementById('progresso');
  p.style.transition = 'none'; p.style.width = '0';
  void p.offsetWidth;
  p.style.transition = 'width ' + DUR + 's linear'; p.style.width = '100%';
}

function troca() {
  if (!vinhos.length) return;
  progresso();
  var atual = document.getElementById('c' + ativa);
  var prox = document.getElementById('c' + (1 - ativa));
  montaCena(prox, vinhos[idx]);
  atual.classList.remove('on');
  // pequena espera para o crossfade respirar
  setTimeout(function () { prox.classList.add('on'); }, 350);
  ativa = 1 - ativa;
  idx = (idx + 1) % vinhos.length;
  if (idx === 0) embaralha(vinhos);
}

Promise.all([
  fetch(SB + '/rest/v1/confras_vinhos_publico?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); }),
  fetch(SB + '/rest/v1/confras_confirmados?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); })
])
  .then(function (res) {
    var rows = res[0];
    (res[1] || []).forEach(function (p) { confsPessoa[p.nome] = p.confrarias || []; });
    vinhos = embaralha(rows || []);
    var litros = 0, paises = {};
    vinhos.forEach(function (g) { litros += Number(g.litros) * (Math.min((g.membros || []).length, g.vagas || 1) / Math.max(1, g.vagas || 1)); if (g.pais) paises[g.pais] = true; });
    document.getElementById('rodape').textContent =
      vinhos.length + ' garrafas · ' + (Math.round(litros * 10) / 10).toLocaleString('pt-BR') + ' litros · ' +
      Object.keys(paises).length + ' países — todas com no mínimo 1,5 litro';
    troca();
    setInterval(troca, DUR * 1000);
  });

// poeira dourada — bolhas subindo devagar
(function () {
  var c = document.getElementById('poeira'), x = c.getContext('2d'), pts = [];
  function dim() { c.width = innerWidth; c.height = innerHeight; }
  dim(); addEventListener('resize', dim);
  for (var i = 0; i < 42; i++) pts.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: .8 + Math.random() * 2.4, v: .12 + Math.random() * .4,
    d: (Math.random() - .5) * .18, f: Math.random() * Math.PI * 2
  });
  (function anima() {
    x.clearRect(0, 0, c.width, c.height);
    pts.forEach(function (p) {
      p.y -= p.v; p.x += p.d; p.f += .015;
      if (p.y < -6) { p.y = c.height + 6; p.x = Math.random() * c.width; }
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7);
      x.fillStyle = 'rgba(212,174,92,' + (.12 + .22 * Math.abs(Math.sin(p.f))) + ')';
      x.fill();
    });
    requestAnimationFrame(anima);
  })();
})();
</script>
</body>
</html>
