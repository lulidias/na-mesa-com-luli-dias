<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Veredicto — Confra das Confras</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
/* ── assinatura padrão CDC (manual da marca: /confras/marca/) ── */
.cdc{text-align:center;padding-top:18px}
.cdc-emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.cdc-nome{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;color:var(--cream)}
.cdc-filete{width:120px;height:1.5px;background:var(--gold-lt);margin:14px auto 12px}
.cdc-cena{font-family:'Montserrat',sans-serif;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.palco{position:absolute;inset:215px 3vw 30px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(14px,1.6vw,26px)}
.cat{border:1px solid rgba(212,174,92,.45);background:rgba(212,174,92,.05);padding:clamp(14px,1.6vh,24px) clamp(16px,1.6vw,26px);display:flex;flex-direction:column;min-height:0}
.cat h2{font-family:'Montserrat',sans-serif;font-size:clamp(13px,1.15vw,19px);letter-spacing:5px;text-transform:uppercase;color:var(--gold-lt);font-weight:600;margin-bottom:10px}
.camp{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.camp .vn{font-family:'Playfair Display',Georgia,serif;font-size:clamp(20px,1.9vw,32px);line-height:1.2}
.camp .vn small{color:var(--gold-lt);font-size:.82em}
.camp .vt{font-family:Didot,'Playfair Display',serif;font-size:clamp(20px,1.9vw,32px);color:var(--gold-lt)}
.camp .quem{width:100%;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(14px,1.25vw,20px);color:rgba(247,243,238,.9)}
.resto{margin-top:10px;flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.row .lb{width:46%;font-size:clamp(11px,1vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(247,243,238,.88)}
.row .trilho{flex:1;height:clamp(10px,1.2vh,16px)}
.row .barra{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold-lt));width:0;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.row .vl{width:34px;font-family:Didot,serif;font-size:clamp(13px,1.2vw,19px);color:var(--gold-lt);text-align:right}
.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,2.4vw,34px);color:rgba(247,243,238,.8);text-align:center;padding:0 10vw}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="cdc">
  <svg class="cdc-emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
  <div class="cdc-nome">Confra das Confras</div>
  <div class="cdc-filete"></div>
  <div class="cdc-cena">O Veredicto da Mesa</div>
</div>
<div class="palco" id="palco"></div>
<div class="aviso hidden" id="aviso" style="display:none">A apuração ainda está em segredo — os vencedores saem na revelação.</div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function monta(rows){
  var cats={}, ordem=[];
  (rows||[]).forEach(function(r){
    if(!cats[r.categoria]){cats[r.categoria]=[];ordem.push(r.categoria);}
    cats[r.categoria].push(r);
  });
  var palco=document.getElementById('palco');
  palco.innerHTML=ordem.slice(0,4).map(function(cat){
    var lista=cats[cat];
    var max=Number(lista[0].votos);
    var campeoes=lista.filter(function(r){return Number(r.votos)===max;});
    var resto=lista.filter(function(r){return Number(r.votos)<max;}).slice(0,5);
    var empate=campeoes.length>1;
    return '<div class="cat"><h2>'+esc(cat)+(empate?' · Empate':'')+'</h2>'+
      campeoes.map(function(c){
        return '<div class="camp"><span class="vn">🏆 '+esc(c.vinho)+(c.safra?' <small>'+esc(c.safra)+'</small>':'')+'</span>'+
          '<span class="vt">'+c.votos+' votos</span>'+
          '<span class="quem">'+esc((c.membros||[]).join(' · '))+'</span></div>';
      }).join('')+
      '<div class="resto">'+resto.map(function(r){
        var pct=Math.max(6,Math.round(Number(r.votos)/max*100));
        return '<div class="row"><span class="lb">'+esc(r.vinho)+(r.safra?' '+esc(r.safra):'')+'</span>'+
          '<span class="trilho"><span class="barra" data-w="'+pct+'"></span></span>'+
          '<span class="vl">'+r.votos+'</span></div>';
      }).join('')+'</div></div>';
  }).join('');
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    [].forEach.call(document.querySelectorAll('.barra'),function(b){b.style.width=b.getAttribute('data-w')+'%';});
  });});
}
function carrega(){
  fetch(SB+'/rest/v1/rpc/confras_resultados',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:'{}'})
  .then(function(r){if(!r.ok) throw 0; return r.json();})
  .then(function(rows){document.getElementById('aviso').style.display='none';monta(rows);})
  .catch(function(){document.getElementById('aviso').style.display='flex';});
}
carrega();
setInterval(carrega, 120000);
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<36;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="/confras/qr-fixo.js?v=4" data-sem-qr></script>
<script src="/confras/tv-remoto.js"></script>
</body>
</html>
