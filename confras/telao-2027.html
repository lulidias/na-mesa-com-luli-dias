<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 — Confra das Confras</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
.caixa{animation:entra 1.6s ease both}
@keyframes entra{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.emblema{width:130px;height:130px;margin:0 auto 20px;animation:pulsa 5s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.k{font-size:clamp(12px,1.3vw,16px);letter-spacing:8px;text-transform:uppercase;color:var(--gold-lt)}
h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(40px,5.5vw,84px);letter-spacing:10px;text-transform:uppercase;line-height:1.15;margin-top:18px}
.ano{font-family:Didot,'Playfair Display',serif;font-size:clamp(26px,3vw,44px);letter-spacing:18px;color:var(--gold-lt);margin-top:10px}
.linha{width:150px;height:2px;background:rgba(212,174,92,.8);margin:34px auto}
.data{font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,3.4vw,52px);letter-spacing:2px}
.dow{font-size:clamp(11px,1.2vw,15px);letter-spacing:6px;text-transform:uppercase;color:var(--gold-lt);margin-bottom:12px}
.frase{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(18px,2vw,28px);color:rgba(247,243,238,.9);margin-top:34px}
</style>
</head>
<body>
<div class="caixa">
  <svg class="emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/>
    <g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)">
      <circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/>
      <circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/>
    </g>
    <path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/>
  </svg>
  <div class="k">Já tem data · guarde na agenda</div>
  <h1>Confra<br>das Confras</h1>
  <div class="ano">2027</div>
  <div class="linha"></div>
  <div class="dow">Quarta-feira</div>
  <div class="data">17 de novembro de 2027</div>
  <p class="frase">A mesma mesa, ainda mais garrafas. Todos os anos, na quarta que antecede o feriado. 🥂</p>
</div>
</body>
</html>
