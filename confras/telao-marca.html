<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Montserrat:wght@500&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;cursor:none}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
svg{width:min(26vh,22vw);height:auto}
h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:min(10vw,15vh);letter-spacing:.14em;text-transform:uppercase;line-height:1.05;margin-top:4vh;padding-left:.14em}
.filete{width:min(22vw,320px);height:2px;background:var(--gold-lt);margin:4vh auto 3vh}
.ano{font-family:'Montserrat',sans-serif;font-weight:500;font-size:min(2.2vw,3.4vh);letter-spacing:.6em;padding-left:.6em;color:var(--gold-lt)}
</style>
</head>
<body>
<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
<h1>Confra<br>das Confras</h1>
<div class="filete"></div>
<div class="ano">2026</div>
<script>document.addEventListener('click',function(){var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){})});</script>
</body>
</html>
