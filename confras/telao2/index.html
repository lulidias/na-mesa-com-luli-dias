<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telão 2 — Quem já votou · Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2"><link rel="apple-touch-icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C;--ok:#2E7D4F}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;padding:22px 28px}
.top{text-align:center;margin-bottom:10px}
.top .k{font-size:clamp(20px,1.6vw,30px);letter-spacing:9px;text-transform:uppercase;color:var(--gold-lt)}
.top h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(36px,4.6vw,62px);letter-spacing:5px;text-transform:uppercase;margin-top:4px}
.top .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,2.4vw,30px);color:rgba(247,243,238,.85);margin-top:6px}
.placar{display:flex;justify-content:center;gap:clamp(30px,6vw,90px);margin:4px 0 8px;align-items:center}
.pl{text-align:center}
.pl .n{font-family:Didot,'Playfair Display',serif;font-size:clamp(58px,6.6vw,98px)}
.pl.sim .n{color:var(--gold-lt)}
.pl.nao .n{color:rgba(247,243,238,.45)}
.pl .l{font-size:20px;letter-spacing:3px;text-transform:uppercase;color:rgba(247,243,238,.65);margin-top:4px}
.todos{display:flex;flex-wrap:wrap;gap:20px 24px;justify-content:center;margin:0 auto;width:100%}
.nome{font-family:'Cormorant Garamond',serif;font-size:clamp(32px,3.3vw,52px);padding:16px 36px;border:1px solid rgba(212,174,92,.3)}
.nome.sim{color:#101F38;background:var(--gold-lt);border-color:var(--gold-lt);font-weight:600}
.nome.nao{color:rgba(247,243,238,.5);font-style:italic}
.legenda{display:flex;justify-content:center;gap:34px;margin:0 0 10px;font-size:16px;letter-spacing:2px;text-transform:uppercase;color:rgba(247,243,238,.7)}
.legenda .dot{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:8px;vertical-align:-2px}
.gate{max-width:380px;margin:20vh auto;text-align:center;background:rgba(0,0,0,.25);border:1px solid rgba(212,174,92,.4);padding:48px 40px}
.gate input{width:100%;padding:13px;border:1px solid rgba(212,174,92,.5);background:rgba(255,255,255,.06);color:var(--cream);font-family:'Montserrat',sans-serif;text-align:center;margin:18px 0;outline:none}
.gate button{padding:13px 34px;background:var(--gold);border:none;color:#fff;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.hidden{display:none!important}
.clock{position:fixed;top:18px;right:26px;font-size:14px;letter-spacing:2px;color:rgba(247,243,238,.5)}
.revela{text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(21px,2.2vw,28px);color:var(--gold-lt);margin-top:18px}
#qr-votar{background:#fff;padding:12px 12px 7px;text-align:center;border:2px solid #D4AE5C;align-self:center}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div style="font-size:10px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-lt)">Telão 2 · Quem já votou</div>
  <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-size:22px;margin-top:10px">Confra das Confras</h1>
  <input type="password" id="tok" placeholder="Token de acesso">
  <button onclick="entrar()">Abrir telão</button>
  <p style="margin-top:26px;font-size:12px;color:rgba(247,243,238,.75);line-height:1.7">Veio <strong>votar</strong>? É aqui:<br><a href="/confras/votar/" style="color:#D4AE5C;font-size:14px">lulidias.com/confras/votar</a></p>
</div>

<div id="app" class="hidden">
  <div class="clock" id="clock"></div>
  <div class="top">
    <div class="k">Confra das Confras · 2026</div>
    <h1>Quem já votou?</h1>
    <div class="sub">Um voto por categoria — a urna fecha às 17h</div>
  </div>
  <div class="placar">
    <div class="pl sim"><div class="n" id="n-sim">–</div><div class="l">já votaram</div></div>
    <div id="qr-votar" class="hidden">
      <canvas id="qr-canvas" width="150" height="150"></canvas>
      <div style="font-size:9px;letter-spacing:2px;color:#101F38;font-weight:600;margin-top:5px">APONTE A CÂMERA<br>E VOTE</div>
    </div>
    <div class="pl nao"><div class="n" id="n-nao">–</div><div class="l">ainda faltam</div></div>
  </div>
  <div class="legenda">
    <span><span class="dot" style="background:var(--gold-lt)"></span>Já votou</span>
    <span><span class="dot" style="border:1px solid rgba(247,243,238,.5)"></span>Ainda falta</span>
  </div>
  <div class="todos" id="l-todos"></div>
  <p class="revela">O ranking dos vencedores será revelado às 17h.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var TOKEN = localStorage.getItem('confras_admin_token') || '';
var qrFeito = false;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rpc(fn, args) {
  return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error((d && d.message) || 'erro'); return d; }); });
}
function view(n) { return fetch(SB + '/rest/v1/' + n + '?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); }); }

function mostraQR(aberta) {
  var box = document.getElementById('qr-votar');
  if (!aberta) { box.classList.add('hidden'); return; }
  box.classList.remove('hidden');
  if (!qrFeito && window.QRious) {
    new QRious({ element: document.getElementById('qr-canvas'), value: 'https://lulidias.com/confras/votar/', size: 150, background: '#FFFFFF', foreground: '#101F38', level: 'M' });
    qrFeito = true;
  }
}

function entrar() {
  var t = document.getElementById('tok').value.trim();
  rpc('confras_admin_quem_votou', { p_token: t }).then(function () {
    TOKEN = t; localStorage.setItem('confras_admin_token', t);
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    tick();
  }).catch(function () { alert('Token inválido'); });
}

function todosNomes(res) { return (res[1] || []).map(function (p) { return p.nome; }); }
function pessoasOrdenadas(votaram, nomes) {
  var vSet = {};
  votaram.forEach(function (n) { vSet[n] = true; });
  return nomes.sort(function (a, b) { return a.localeCompare(b, 'pt'); })
    .map(function (n) { return { nome: n, votou: !!vSet[n] }; });
}
function tick() {
  Promise.all([
    rpc('confras_admin_quem_votou', { p_token: TOKEN }),
    view('confras_confirmados'),
    view('confras_config_publica')
  ]).then(function (res) {
    var votaram = (res[0] || []).map(function (r) { return r.nome; });
    var todos = (res[1] || []).map(function (p) { return p.nome; });
    var cfg = (res[2] || [])[0] || {};
    mostraQR(cfg.votacao_aberta === true);
    var vSet = {};
    votaram.forEach(function (n) { vSet[n] = true; });
    var faltam = todos.filter(function (n) { return !vSet[n]; }).sort(function (a, b) { return a.localeCompare(b, 'pt'); });
    document.getElementById('n-sim').textContent = votaram.length;
    document.getElementById('n-nao').textContent = faltam.length;
    var todos = pessoasOrdenadas(votaram, todosNomes(res));
    document.getElementById('l-todos').innerHTML = todos.map(function (p) {
      return '<span class="nome ' + (p.votou ? 'sim' : 'nao') + '">' + esc(p.nome) + '</span>';
    }).join('');
    ajustaEscala();
  }).catch(function () { });
}

function ajustaEscala() {
  var app = document.getElementById('app');
  app.style.transform = 'none';
  var s = Math.min(1, (window.innerHeight - 40) / app.scrollHeight);
  app.style.transformOrigin = 'top center';
  app.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', ajustaEscala);

setInterval(function () {
  var d = new Date();
  document.getElementById('clock').textContent = ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
}, 1000);
setInterval(function () { if (TOKEN && !document.getElementById('app').classList.contains('hidden')) tick(); }, 15000);

if (TOKEN) {
  document.getElementById('tok').value = TOKEN;
  entrar();
}
document.getElementById('tok').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrar(); });
</script>
</body>
</html>
