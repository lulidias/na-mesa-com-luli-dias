<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Números — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
.k{font-size:clamp(20px,1.6vw,30px);letter-spacing:9px;text-transform:uppercase;color:var(--gold-lt);text-align:center}
h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(38px,4.6vw,66px);letter-spacing:7px;text-transform:uppercase;margin:12px 0 0;text-align:center}
.grade{display:flex;gap:clamp(30px,5vw,90px);margin-top:clamp(40px,6vh,80px);align-items:flex-start}
.stat{text-align:center;min-width:180px}
.stat .n{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-size:clamp(80px,9.5vw,168px);color:var(--gold-lt);line-height:1}
.stat .n small{font-size:.45em}
.stat .l{font-size:clamp(15px,1.3vw,22px);letter-spacing:5px;text-transform:uppercase;color:rgba(247,243,238,.85);margin-top:14px}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="k">Confra das Confras · 2026</div>
<h1>Os Números da Mesa</h1>
<div class="grade" id="grade"></div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
function v(path){return fetch(SB+'/rest/v1/'+path,{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}}).then(function(r){return r.json();});}
var STATS=[];
function conta(el, alvo, sufixo, dec){
  var ini=null, dur=1800;
  function passo(t){
    if(!ini) ini=t;
    var p=Math.min(1,(t-ini)/dur); p=1-Math.pow(1-p,3);
    var val=alvo*p;
    el.textContent=(dec?val.toFixed(1).replace('.',','):Math.round(val))+'';
    if(sufixo) el.innerHTML=(dec?val.toFixed(1).replace('.',','):Math.round(val))+'<small> '+sufixo+'</small>';
    if(p<1) requestAnimationFrame(passo);
  }
  requestAnimationFrame(passo);
}
function render(){
  var g=document.getElementById('grade');
  g.innerHTML=STATS.map(function(s,i){
    return '<div class="stat"><div class="n" id="n'+i+'">0</div><div class="l">'+s.l+'</div></div>';
  }).join('');
  STATS.forEach(function(s,i){
    setTimeout(function(){conta(document.getElementById('n'+i), s.v, s.suf, s.dec);}, 250*i);
  });
}
function carrega(){
  Promise.all([
    v('confras_vinhos_publico?select=litros,vagas,membros,pais'),
    v('confras_confirmados?select=nome')
  ]).then(function(res){
    var vinhos=res[0]||[], pessoas=res[1]||[];
    var litros=0, paises={}, maior=0;
    vinhos.forEach(function(gf){
      var vg=Math.max(1,gf.vagas||1);
      litros+=Number(gf.litros)*(Math.min((gf.membros||[]).length,vg)/vg);
      if(gf.pais) paises[gf.pais]=true;
      if(Number(gf.litros)>maior) maior=Number(gf.litros);
    });
    STATS=[
      {v:pessoas.length, l:'Confrades'},
      {v:vinhos.length,  l:'Garrafas'},
      {v:Math.round(litros*10)/10, l:'Litros', suf:'L', dec:true},
      {v:Object.keys(paises).length, l:'Países'},
      {v:maior, l:'Maior garrafa', suf:'L'}
    ];
    render();
  });
}
carrega();
setInterval(carrega, 45000);   // dados frescos e contagem de novo a cada passagem
// poeira dourada
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<42;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.4,v:.12+Math.random()*.4,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.12+.22*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
</body>
</html>
