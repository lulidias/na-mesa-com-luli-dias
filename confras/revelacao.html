<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Premiação — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;cursor:pointer}
#poeira{position:fixed;inset:0;pointer-events:none;z-index:5}
.tela{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s ease}
.tela.on{opacity:1}
.k{font-size:clamp(12px,1.3vw,16px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.marca{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;letter-spacing:9px;text-transform:uppercase;font-size:clamp(34px,4.6vw,66px);line-height:1.15;margin-top:16px}
.emblema{width:120px;height:120px;margin-bottom:22px;animation:pulsa 5s ease-in-out infinite}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.dica{position:fixed;bottom:22px;right:30px;font-size:11px;letter-spacing:2px;color:rgba(247,243,238,.4);z-index:9}
/* suspense */
.cat-sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,2.4vw,32px);color:rgba(247,243,238,.9);margin-top:36px}
.pontos::after{content:'';animation:pts 1.8s steps(4,end) infinite}
@keyframes pts{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.taca{font-size:clamp(50px,6vw,90px);margin-bottom:10px;animation:pulsa 2.2s ease-in-out infinite}
/* revelação */
.rev{display:flex;align-items:center;justify-content:center;gap:clamp(40px,6vw,110px);padding:0 60px}
.tela.on .foto{animation:entraFoto 1s cubic-bezier(.2,.7,.3,1) both .15s}
.tela.on .info>*{opacity:0;animation:entraItem .8s cubic-bezier(.2,.7,.3,1) both}
.tela.on .info>*:nth-child(1){animation-delay:.5s}
.tela.on .info>*:nth-child(2){animation-delay:.75s}
.tela.on .info>*:nth-child(3){animation-delay:1s}
.tela.on .info>*:nth-child(4){animation-delay:1.25s}
.tela.on .info>*:nth-child(5){animation-delay:1.5s}
@keyframes entraFoto{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes entraItem{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
.foto{background:#fff;padding:34px 44px;border:2px solid var(--gold-lt);display:flex;align-items:center;justify-content:center;height:min(60vh,540px);box-shadow:0 0 110px rgba(212,174,92,.3)}
.foto img{max-height:100%;max-width:300px;display:block}
.info{max-width:46vw;text-align:left}
.info .venceu{font-size:14px;letter-spacing:5px;text-transform:uppercase;color:var(--gold-lt)}
.info .nome{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(40px,4.6vw,72px);line-height:1.12;margin-top:12px}
.info .safra{font-family:Didot,'Playfair Display',serif;font-size:clamp(26px,3vw,44px);color:var(--gold-lt);margin-top:4px}
.info .fmt{display:inline-block;border:2px solid rgba(212,174,92,.85);color:var(--gold-lt);font-size:14px;letter-spacing:3px;text-transform:uppercase;padding:10px 22px;margin-top:20px}
.info .quem{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(19px,2vw,28px);color:rgba(247,243,238,.95);margin-top:24px}
/* gate */
.gate{max-width:380px;margin:20vh auto;text-align:center;background:rgba(0,0,0,.25);border:1px solid rgba(212,174,92,.4);padding:48px 40px;position:relative;z-index:20;cursor:default}
.gate input{width:100%;padding:13px;border:1px solid rgba(212,174,92,.5);background:rgba(255,255,255,.06);color:var(--cream);font-family:'Montserrat',sans-serif;text-align:center;margin:18px 0;outline:none}
.gate button{padding:13px 34px;background:var(--gold);border:none;color:#fff;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.hidden{display:none!important}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="k" style="font-size:10px;letter-spacing:5px">A Premiação · controle do mestre de cerimônias</div>
  <h1 style="font-family:'Playfair Display',serif;font-weight:400;font-size:22px;margin-top:10px">Confra das Confras</h1>
  <input type="password" id="tok" placeholder="Token de acesso">
  <button onclick="entrar()">Preparar a revelação</button>
</div>

<div id="palco"></div>
<canvas id="poeira"></canvas>
<div class="dica hidden" id="dica">clique ou → para avançar · ← volta</div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var TOKEN = localStorage.getItem('confras_admin_token') || '';
var ORDEM = ['Melhor Espumante', 'Melhor Branco', 'Melhor Tinto', 'Melhor Vinho da Festa'];
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷' };
var telas = [], passo = -1;
var DEMO = !!new URLSearchParams(location.search).get('demo');

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rpc(fn, args) {
  return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error((d && d.message) || 'erro'); return d; }); });
}
function view(n) { return fetch(SB + '/rest/v1/' + n + '?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); }); }

var EMBLEMA = '<svg class="emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">' +
  '<circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/>' +
  '<g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)">' +
  '<circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/>' +
  '<circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g>' +
  '<path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>';

function telaCapa() {
  return EMBLEMA + '<div class="k">Confra das Confras · 2026</div><div class="marca">A Premiação</div>' +
    '<div class="cat-sub">Os melhores vinhos da festa, eleitos pelos confrades.</div>';
}
function telaSuspense(cat) {
  return '<div class="taca">🏆</div><div class="k">A Premiação · Confra das Confras 2026</div>' +
    '<div class="marca" style="font-size:clamp(30px,4vw,56px)">' + esc(cat.toUpperCase()) + '</div>' +
    '<div class="cat-sub">E o vencedor é<span class="pontos"></span></div>';
}
function telaReveal(cat, g) {
  return '<div class="rev">' +
    (g.foto_url ? '<div class="foto"><img src="' + esc(g.foto_url) + '"></div>' : '') +
    '<div class="info">' +
      '<div class="venceu">🏆 ' + esc(cat.toUpperCase()) + ' · ' + (FLAGS[g.pais] || '') + ' ' + esc(g.pais || '') + '</div>' +
      '<div class="nome">' + esc(g.vinho) + '</div>' +
      (g.safra ? '<div class="safra">' + esc(g.safra) + '</div>' : '') +
      '<div class="fmt">' + esc(g.formato) + (g.votos ? ' · ' + g.votos + ' voto' + (g.votos > 1 ? 's' : '') : '') + '</div>' +
      '<div class="quem">Trazido por ' + esc((g.membros || []).join(', ')) + '</div>' +
    '</div></div>';
}
function telaFim() {
  return EMBLEMA + '<div class="k">Obrigado, confrades 🥂</div><div class="marca">Até 2027</div>' +
    '<div class="cat-sub">Quarta-feira, 17 de novembro de 2027 — a mesma mesa, ainda mais garrafas.</div>';
}

function montar(vencedores) {
  var palco = document.getElementById('palco');
  telas = [{ html: telaCapa() }];
  ORDEM.forEach(function (cat) {
    var g = vencedores[cat];
    if (!g) return;
    telas.push({ html: telaSuspense(cat) });
    telas.push({ html: telaReveal(cat, g), burst: true });
  });
  telas.push({ html: telaFim() });
  palco.innerHTML = telas.map(function (t, i) { return '<div class="tela" id="t' + i + '">' + t.html + '</div>'; }).join('');
  passo = -1; avanca(1);
}

function mostra(novo, comBurst) {
  passo = novo;
  for (var i = 0; i < telas.length; i++) document.getElementById('t' + i).classList.toggle('on', i === passo);
  if (comBurst && telas[passo].burst) burst();
}
function avanca(dir) {
  var novo = Math.max(0, Math.min(telas.length - 1, passo + dir));
  if (novo === passo) return;
  mostra(novo, dir > 0);
  if (TOKEN && !DEMO) rpc('confras_revelacao_set', { p_token: TOKEN, p_passo: passo }).catch(function () { });
}
// sincronização com o controle remoto (celular)
function sincroniza() {
  if (!TOKEN || DEMO || !telas.length) return;
  rpc('confras_revelacao_get', { p_token: TOKEN }).then(function (r) {
    var alvo = Math.max(0, Math.min(telas.length - 1, Number(r) || 0));
    if (alvo === passo) return;
    mostra(alvo, alvo > passo);
  }).catch(function () { });
}
setInterval(sincroniza, 1200);

function entrar() {
  var t = document.getElementById('tok').value.trim();
  rpc('confras_admin_resultados', { p_token: t }).then(function (rows) {
    TOKEN = t; localStorage.setItem('confras_admin_token', t);
    carregar(rows);
  }).catch(function () { alert('Token inválido'); });
}

function carregar(rows) {
  view('confras_vinhos_publico').then(function (vinhos) {
    var fotos = {};
    (vinhos || []).forEach(function (v) { fotos[v.id] = v; });
    var vencedores = {}, vistos = {};
    (rows || []).forEach(function (r) {
      if (vistos[r.categoria_id]) return;
      vistos[r.categoria_id] = true;
      var extra = fotos[r.garrafa_id] || {};
      vencedores[r.categoria] = { vinho: r.vinho, safra: r.safra, formato: r.formato, membros: r.membros, votos: Number(r.votos), foto_url: extra.foto_url, pais: extra.pais };
    });
    document.getElementById('gate').classList.add('hidden');
    document.getElementById('dica').classList.remove('hidden');
    montar(vencedores);
  });
}

// demonstração sem urna: ?demo=1
if (DEMO) {
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('dica').classList.remove('hidden');
  montar({
    'Melhor Espumante': { vinho: 'Cave Geisse', safra: '2013', formato: 'Magnum', membros: ['Marcelo Sandes'], votos: 14, pais: 'Brasil', foto_url: '' },
    'Melhor Branco': { vinho: 'Guru', safra: '2010', formato: 'Magnum', membros: ['Milton Rocha'], votos: 17, pais: 'Portugal', foto_url: 'https://images.vivino.com/thumbs/byKy3nNwRlmQOdDyLD2Mwg_pb_x600.png' },
    'Melhor Tinto': { vinho: 'Fontalloro', safra: '1995', formato: 'Magnum', membros: ['Felipe Valenca de Sousa'], votos: 21, pais: 'Itália', foto_url: 'https://images.vivino.com/thumbs/Qs6gkLUMQ7-V4KgmqdJ_5A_pb_x600.png' },
    'Melhor Vinho da Festa': { vinho: 'Malleolus', safra: '2019', formato: 'Salmanazar', membros: ['Agostinho Gomes', 'Alberto Porpino', 'Halim Nagem Neto', 'Jorge Petribu', 'Jorge Pinho', 'Rafael Petribu'], votos: 24, pais: 'Espanha', foto_url: 'https://images.vivino.com/thumbs/acyKDNYCQ4CsXVyQBWafaA_pb_x600.png' }
  });
} else if (TOKEN) {
  rpc('confras_admin_resultados', { p_token: TOKEN }).then(carregar).catch(function () { });
}

document.addEventListener('keydown', function (e) {
  var gateAberto = !document.getElementById('gate').classList.contains('hidden');
  if (gateAberto) { if (e.key === 'Enter') entrar(); return; }
  if (e.key === 'ArrowRight' || e.key === 'Enter' || e.key === ' ' || e.key === 'PageDown') avanca(1);
  if (e.key === 'ArrowLeft' || e.key === 'PageUp') avanca(-1);
});
document.addEventListener('click', function (e) {
  if (!document.getElementById('gate').classList.contains('hidden')) return;
  avanca(1);
});

// poeira + explosão dourada
var burstPts = [];
function burst() {
  var cx = innerWidth / 2, cy = innerHeight / 2;
  for (var i = 0; i < 110; i++) {
    var a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 11;
    burstPts.push({ x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, r: 1.5 + Math.random() * 3, vida: 1 });
  }
}
(function () {
  var c = document.getElementById('poeira'), x = c.getContext('2d'), pts = [];
  function dim() { c.width = innerWidth; c.height = innerHeight; }
  dim(); addEventListener('resize', dim);
  for (var i = 0; i < 42; i++) pts.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: .8 + Math.random() * 2.4, v: .12 + Math.random() * .4,
    d: (Math.random() - .5) * .18, f: Math.random() * Math.PI * 2
  });
  (function anima() {
    x.clearRect(0, 0, c.width, c.height);
    pts.forEach(function (p) {
      p.y -= p.v; p.x += p.d; p.f += .015;
      if (p.y < -6) { p.y = c.height + 6; p.x = Math.random() * c.width; }
      x.beginPath(); x.arc(p.x, p.y, p.r, 0, 7);
      x.fillStyle = 'rgba(212,174,92,' + (.12 + .22 * Math.abs(Math.sin(p.f))) + ')';
      x.fill();
    });
    burstPts = burstPts.filter(function (p) { return p.vida > 0; });
    burstPts.forEach(function (p) {
      p.x += p.vx; p.y += p.vy; p.vx *= .965; p.vy = p.vy * .965 + .12; p.vida -= .011;
      x.beginPath(); x.arc(p.x, p.y, p.r * p.vida, 0, 7);
      x.fillStyle = 'rgba(212,174,92,' + (.85 * p.vida) + ')';
      x.fill();
    });
    requestAnimationFrame(anima);
  })();
})();
</script>
</body>
</html>
