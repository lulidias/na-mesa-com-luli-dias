<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* TEMPORÁRIO 18/11: pedido do Luli — o telão para na tela só do QR */if(window.top!==window){try{window.top.location.replace("/confras/telao2/")}catch(e){}}</script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Gráficos — Confra das Confras 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.cdc{text-align:center;padding-top:18px}
.cdc-emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.cdc-nome{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;color:var(--cream)}
.cdc-filete{width:120px;height:1.5px;background:var(--gold-lt);margin:14px auto 12px}
.cdc-cena{font-family:'Montserrat',sans-serif;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.palco{position:absolute;inset:230px 8vw 50px}
.lamina{position:absolute;inset:0;visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.lamina.on{visibility:visible}
.lamina h2{font-family:'Playfair Display',Georgia,serif;font-size:clamp(34px,3.4vw,54px);text-align:center;margin-bottom:34px;font-weight:400}
.row{display:flex;align-items:center;gap:22px;margin:14px 0}
.row .lb{width:30%;text-align:right;font-size:clamp(24px,2.2vw,38px);letter-spacing:1px}
.row .trilho{flex:1;height:clamp(28px,3vh,44px);position:relative}
.row .barra{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--gold),var(--gold-lt));width:0}
.lamina.on .barra{animation:cresce 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cresce{to{width:var(--w)}}
.row .vl{width:90px;font-family:Didot,'Playfair Display',serif;font-size:clamp(30px,3vw,50px);color:var(--gold-lt)}
/* safra: colunas */
.cols{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1vw,18px);height:58vh}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .cv{font-family:Didot,serif;font-size:clamp(20px,1.8vw,30px);color:var(--gold-lt);margin-bottom:6px}
.col .cb{width:clamp(34px,3.4vw,62px);background:linear-gradient(180deg,var(--gold-lt),var(--gold));height:0}
.lamina.on .cb{animation:sobe 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sobe{to{height:var(--h)}}
.col .cl{font-size:clamp(15px,1.3vw,22px);margin-top:10px;letter-spacing:1px;color:rgba(247,243,238,.85)}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="cdc">
  <svg class="cdc-emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
  <div class="cdc-nome">Confra das Confras</div>
  <div class="cdc-filete"></div>
  <div class="cdc-cena" id="cena-rotulo">A mesa em números</div>
</div>
<div class="palco" id="palco"></div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguai': '🇺🇾' };
var TROCA = Number(new URLSearchParams(location.search).get('t')) || 7;
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function conta(vinhos, campo){
  var m={};
  vinhos.forEach(function(g){var k=g[campo]; if(k==null||k==='') return; m[k]=(m[k]||0)+1;});
  return Object.keys(m).map(function(k){return [k, m[k]];}).sort(function(a,b){return b[1]-a[1];});
}
function laminaBarras(titulo, dados, flags){
  var max=Math.max.apply(null,dados.map(function(d){return d[1];}));
  return '<h2>'+titulo+'</h2>'+dados.map(function(d){
    var pct=Math.round(d[1]/max*100);
    return '<div class="row"><div class="lb">'+(flags?(FLAGS[d[0]]||'')+' ':'')+esc(d[0])+'</div>'+
      '<div class="trilho"><div class="barra" style="--w:'+pct+'%"></div></div>'+
      '<div class="vl">'+d[1]+'</div></div>';
  }).join('');
}
function laminaSafras(dados){
  dados=dados.slice().sort(function(a,b){
    if(a[0]==='NV') return 1; if(b[0]==='NV') return -1;
    return Number(a[0])-Number(b[0]);
  });
  var max=Math.max.apply(null,dados.map(function(d){return d[1];}));
  return '<h2>As safras da mesa</h2><div class="cols">'+dados.map(function(d){
    var pct=Math.round(d[1]/max*88)+8;
    return '<div class="col"><div class="cv">'+d[1]+'</div><div class="cb" style="--h:'+pct+'%"></div><div class="cl">'+esc(d[0])+'</div></div>';
  }).join('')+'</div>';
}
var atual=0, flipTimer=null;
function montar(vinhos){
  var laminas=[
    laminaBarras('A carta por categoria', conta(vinhos,'tipo')),
    laminaBarras('Os formatos das garrafas', conta(vinhos,'formato')),
    laminaBarras('A disputa das nações', conta(vinhos,'pais'), true),
    laminaSafras(conta(vinhos,'safra').map(function(d){return [d[0]||'NV', d[1]];}))
  ];
  var palco=document.getElementById('palco'); palco.innerHTML='';
  laminas.forEach(function(html,ix){
    var el=document.createElement('div'); el.className='lamina'; el.id='lam'+ix;
    el.innerHTML=html; palco.appendChild(el);
  });
  atual=0;
  document.getElementById('lam0').classList.add('on');
  if(flipTimer) clearInterval(flipTimer);
  flipTimer=setInterval(function(){
    document.getElementById('lam'+atual).classList.remove('on');
    atual=(atual+1)%laminas.length;
    document.getElementById('lam'+atual).classList.add('on');
  },TROCA*1000);
}
function carrega(){
  fetch(SB+'/rest/v1/confras_vinhos_publico?select=tipo,formato,pais,safra',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
  .then(function(r){return r.json();})
  .then(function(v){ montar(v||[]); })
  .catch(function(){});
}
carrega();
setInterval(carrega, 180000);
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<36;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="/confras/qr-fixo.js?v=3"></script>
</body>
</html>
