<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Montserrat',sans-serif}
.hero{width:1200px;height:520px;background:radial-gradient(130% 160% at 50% -20%,#2A4468 0%,#1A2F4E 45%,#101F38 100%);color:#F7F3EE;text-align:center;position:relative;padding-top:44px}
.hero::after{content:'';position:absolute;inset:12px;border:1px solid rgba(212,174,92,.4)}
.k{font-size:15px;letter-spacing:8px;color:#D4AE5C}
h1{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:84px;letter-spacing:12px;line-height:1.08;margin-top:18px}
h1 .a{display:block;font-size:30px;letter-spacing:16px;color:#D4AE5C;margin-bottom:6px}
.tag{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:26px;color:rgba(247,243,238,.9);margin-top:16px}
.when{font-family:Didot,'Playfair Display',serif;font-size:34px;margin-top:22px;color:#F7F3EE}
.when b{color:#D4AE5C;font-weight:normal;padding:0 10px}
.strip{width:1200px;height:110px;background:#F7F3EE;display:flex;align-items:center;justify-content:center;gap:64px}
.strip img{max-height:78px;max-width:130px;object-fit:contain}
</style>
</head>
<body>
<div class="hero">
  <div class="k">RECIFE · PERNAMBUCO · BRASIL</div>
  <h1><span class="a">A</span>CONFRA DAS CONFRAS</h1>
  <div class="tag">O maior encontro de vinhos da história de Pernambuco</div>
  <div class="when">18 de novembro<b>·</b>13h<b>·</b>PSG Academy</div>
</div>
<div class="strip">
  <img src="logos/commanderie.png">
  <img src="logos/porquinho.png">
  <img src="logos/wine-lovers-recife.png">
  <img src="logos/confra-wine-recife.png">
  <img src="logos/over20.svg">
</div>
</body>
</html>
