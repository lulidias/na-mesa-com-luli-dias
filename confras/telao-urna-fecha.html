<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* telão em giro navega no topo */if(window.top!==window){}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A urna fecha — Confra das Confras</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/confras/favicon.png?v=2">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Cormorant+Garamond:ital@1&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--wine:#101F38;--wine-md:#1A2F4E;--wine-lt:#2A4468;--cream:#F7F3EE;--gold:#B8922A;--gold-lt:#D4AE5C}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.cdc-emblema{width:76px;height:76px;margin:0 auto 10px;display:block}
.cdc-nome{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-weight:400;font-size:clamp(30px,3vw,46px);letter-spacing:9px;text-transform:uppercase;color:var(--cream)}
.cdc-filete{width:120px;height:1.5px;background:var(--gold-lt);margin:14px auto 12px}
.cdc-cena{font-family:'Montserrat',sans-serif;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--gold-lt)}
.rotulo{font-size:clamp(22px,2vw,34px);letter-spacing:10px;text-transform:uppercase;color:var(--cream);margin-top:clamp(30px,5vh,60px)}
.conta{font-family:Didot,'Bodoni 72','Playfair Display',Georgia,serif;font-size:clamp(160px,20vw,340px);color:var(--gold-lt);line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,2.2vw,34px);color:rgba(247,243,238,.9);margin-top:26px}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div>
  <svg class="cdc-emblema" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="56" stroke="#B8922A" stroke-width="1" opacity=".6"/><g stroke="#D4AE5C" stroke-width="1.6" fill="rgba(212,174,92,.08)"><circle cx="60" cy="38" r="16"/><circle cx="81" cy="53" r="16"/><circle cx="73" cy="78" r="16"/><circle cx="47" cy="78" r="16"/><circle cx="39" cy="53" r="16"/></g><path d="M60 55l5 5-5 5-5-5z" fill="#D4AE5C"/></svg>
  <div class="cdc-nome">Confra das Confras</div>
  <div class="cdc-filete"></div>
  <div class="cdc-cena">Últimos minutos</div>
</div>
<div class="rotulo">A urna fecha em</div>
<div class="conta" id="conta">–:–</div>
<div class="sub">Ainda não votou? Aponte a câmera para o QR e escolha os seus campeões.</div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var JANELA_MIN = 30;           // a cena só vale nos últimos 30 minutos
var fecha = null, urnaAberta = false;
function cfg(){
  fetch(SB+'/rest/v1/confras_config_publica?select=urna_fecha,votacao_aberta',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
  .then(function(r){return r.json();})
  .then(function(rows){
    var c=(rows||[])[0]||{};
    urnaAberta=!!c.votacao_aberta;
    fecha=c.urna_fecha?new Date(c.urna_fecha).getTime():null;
  }).catch(function(){});
}
cfg(); setInterval(cfg, 30000);
function devoAparecer(){
  if(!urnaAberta||!fecha) return false;
  var d=fecha-Date.now();
  return d>0 && d<=JANELA_MIN*60*1000;
}
setInterval(function(){
  var d=fecha?Math.max(0,fecha-Date.now()):0;
  var m=Math.floor(d/60000), s=Math.floor(d/1000)%60;
  document.getElementById('conta').textContent=m+':'+(s<10?'0':'')+s;
},250);
// fora da janela, a cena pede ao giro para pular
(function(){
  var f=window.frameElement, avisou=false;
  if(!f) return;
  setInterval(function(){
    var on=f.classList.contains('on');
    if(on && !devoAparecer()){
      if(!avisou){ avisou=true; try{ window.parent.postMessage('cdc-pular','*'); }catch(e){} }
    } else if(!on){ avisou=false; }
  },400);
})();
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<40;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(212,174,92,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="/confras/qr-fixo.js?v=4"></script>
<script src="/confras/tv-remoto.js"></script>
</body>
</html>
