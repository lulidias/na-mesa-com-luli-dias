name: Build counts.json

# Roda automaticamente sempre que algum guia ou um dos scripts muda.
# Re-gera counts.json, sincroniza as stats-bars dos guias e dá commit
# automático se algo mudou.

on:
  push:
    branches: [main]
    paths:
      - '*-guia.html'
      - 'brasil-*.html'
      - 'scripts/build-counts.js'
      - 'scripts/sync-stats-bars.js'
      - 'scripts/sync-brasil-index.js'
      - '.github/workflows/build-counts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário porque vamos fazer commit de volta para main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate counts.json
        run: node scripts/build-counts.js

      - name: Sync stats-bars dos guias
        run: node scripts/sync-stats-bars.js

      - name: Sync cards do brasil-index.html
        run: node scripts/sync-brasil-index.js

      - name: Check for changes
        id: changed
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Nada mudou"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Há alterações — vai fazer commit"
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counts.json '*-guia.html' brasil-*.html brasil-index.html
          git commit -m "chore: atualizar contagens automaticamente [skip ci]"
          git push
