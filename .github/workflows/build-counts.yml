name: Build counts.json

# Roda automaticamente sempre que algum guia ou o script muda.
# Re-gera counts.json e dá commit automático se mudou.

on:
  push:
    branches: [main]
    paths:
      - '*-guia.html'
      - 'brasil-*.html'
      - 'scripts/build-counts.js'
      - '.github/workflows/build-counts.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Necessário porque vamos fazer commit de volta para main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate counts.json
        run: node scripts/build-counts.js

      - name: Check if counts.json changed
        id: changed
        run: |
          if git diff --quiet counts.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "counts.json sem alterações"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "counts.json mudou — vai fazer commit"
          fi

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add counts.json
          git commit -m "chore: atualizar contagens automaticamente [skip ci]"
          git push
