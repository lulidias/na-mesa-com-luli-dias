name: Purge Cloudflare Cache

# Espera o deploy do Pages concluir antes de purgar. (Gatilho workflow_run
# não funciona com o workflow interno "pages build and deployment" do GitHub,
# então o jeito confiável é aguardar tempo suficiente após o push.)
on:
  push:
    branches: [main]

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Aguardar o deploy do Pages
        run: sleep 150
      - name: Purge Cloudflare Cache
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
