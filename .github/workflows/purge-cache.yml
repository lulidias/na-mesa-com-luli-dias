name: Purge Cloudflare Cache

# Dispara DEPOIS que o deploy do GitHub Pages termina — purgar no push
# perdia a corrida (o Cloudflare recacheava a versão antiga por 4h).
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]

jobs:
  purge:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Purge Cloudflare Cache
        run: |
          sleep 20   # margem para a propagação do deploy
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ secrets.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
