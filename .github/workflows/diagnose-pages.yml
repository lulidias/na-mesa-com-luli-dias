name: Diagnose Pages

# Diagnóstico temporário: grava o estado do GitHub Pages em diagnostics/
# para investigar porque os deploys pararam. Pode ser removido depois.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Consultar estado do Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostics
          {
            echo "== gerado em: $(date -u) =="
            echo ""
            echo "== /pages (config) =="
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
            echo ""
            echo "== /pages/builds/latest =="
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds/latest"
            echo ""
            echo "== /pages/builds (últimos 5) =="
            curl -s -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds?per_page=5"
          } > diagnostics/pages-status.txt

      - name: Commitar resultado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnostics/pages-status.txt
          git diff --cached --quiet || git commit -m "diagnostics: estado do Pages [skip ci]"
          git push
