name = "luli-admin"
main = "worker.js"
compatibility_date = "2024-09-01"

# Variáveis NÃO-secretas (estas vão pro Git, não inclui chaves)
[vars]
GITHUB_OWNER = "lulidias"
GITHUB_REPO = "na-mesa-com-luli-dias"

# Stripe — chaves e IDs públicos (ok ir para Git)
STRIPE_PUBLISHABLE_KEY = "pk_test_51TVfXCHDKFMdeZioMVYJb9BsIev4tXkE2YpFgACg2ke2dubIyDKie3yjGocptMqZtq3KwlYpsJ4WQfWBk1cn0V3B00T4pzFO9x"
STRIPE_PRICE_ANNUAL = "price_1TVh7YHDKFMdeZioZ9HyZwwy"
STRIPE_PRICE_FOUNDER_ANNUAL = "price_1TVhAUHDKFMdeZioWeEE4vBY"
STRIPE_PRICE_FOUNDER_LIFETIME = "price_1TVhCDHDKFMdeZioNNbUyeb9"

# D1 database (CRM: subscribers, events, founder codes, sessions)
[[d1_databases]]
binding = "DB"
database_name = "lulidias-db"
database_id = "174f85c4-40ee-4209-b15d-1ec1d31ed9b2"

# Cron: sincroniza Mailchimp → D1 diariamente às 09:00 UTC (mantém a base de cadastros sempre completa)
[triggers]
crons = ["0 9 * * *"]

# Os secrets seguintes são configurados separadamente via:
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put GITHUB_TOKEN
#   wrangler secret put ADMIN_KEY
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET
#   wrangler secret put RESEND_API_KEY
#
# OU pelo dashboard Cloudflare → Workers → luli-admin → Settings → Variables
