<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px;
    height: 630px;
    background: #F7F3EE;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .frame {
    width: 1136px;
    height: 566px;
    border: 1.5px solid #B8922A;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
  }
  .frame::before {
    content: '';
    position: absolute;
    inset: 6px;
    border: 0.5px solid #B8922A;
    opacity: 0.4;
    pointer-events: none;
  }
  .brand-name {
    font-family: 'Playfair Display', 'Georgia', serif;
    font-size: 110px;
    font-weight: 400;
    color: #1A1A1A;
    letter-spacing: 28px;
    padding-left: 28px;
    line-height: 1;
    text-align: center;
  }
  .brand-tagline {
    font-family: 'Montserrat', sans-serif;
    font-size: 32px;
    font-weight: 300;
    color: #1A1A1A;
    letter-spacing: 14px;
    text-transform: uppercase;
    margin-top: 14px;
    text-align: center;
  }
  .divider {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 30px 0 0;
    width: 700px;
  }
  .divider-line {
    flex: 1;
    height: 1px;
    background: #B8922A;
  }
  .divider-diamond {
    width: 7px;
    height: 7px;
    background: #B8922A;
    transform: rotate(45deg);
    flex-shrink: 0;
  }
  .domain {
    position: absolute;
    bottom: 28px;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-weight: 300;
    color: #B8922A;
    letter-spacing: 4px;
    font-style: italic;
  }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand-name">LULI DIAS</div>
    <div class="brand-tagline">Restaurants &amp; Hotels</div>
    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-diamond"></div>
      <div class="divider-line"></div>
    </div>
    <div class="domain">lulidias.com</div>
  </div>
</body>
</html>
