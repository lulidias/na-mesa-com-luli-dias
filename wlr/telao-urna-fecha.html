<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A urna fecha — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#411A39;--wine-md:#4F1D45;--wine-lt:#6C214C;--cream:#FFFFFF;--rosa:#E9C9DA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mf-logo{height:clamp(84px,11vh,120px);width:auto;display:block;margin:0 auto}
.mf-filete{width:120px;height:1.5px;background:var(--rosa);margin:14px auto 12px}
.mf-cena{font-weight:600;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--cream)}
.rotulo{font-weight:600;font-size:clamp(22px,2vw,34px);letter-spacing:10px;text-transform:uppercase;color:var(--rosa);margin-top:clamp(30px,5vh,60px)}
.conta{font-weight:800;font-size:clamp(160px,19vw,320px);color:var(--cream);line-height:1;margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,2.2vw,34px);color:rgba(255,255,255,.9);margin-top:26px}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div>
  <img class="mf-logo" src="img/magnumfest-logo-branca.png" alt="Magnum Fest Licínio Dias">
  <div class="mf-filete"></div>
  <div class="mf-cena">Últimos minutos</div>
</div>
<div class="rotulo">A urna fecha em</div>
<div class="conta" id="conta">–:–</div>
<div class="sub">Ainda não votou? Aponte a câmera para o QR e escolha os seus campeões.</div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var JANELA_MIN = 30;           // a cena só vale nos últimos 30 minutos
var fecha = null, urnaAberta = false;
function cfg(){
  fetch(SB+'/rest/v1/wlr_config_publica?select=urna_fecha_em,votacao_aberta',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}})
  .then(function(r){return r.json();})
  .then(function(rows){
    var c=(rows||[])[0]||{};
    urnaAberta=!!c.votacao_aberta;
    fecha=c.urna_fecha_em?new Date(c.urna_fecha_em).getTime():null;
  }).catch(function(){});
}
// ?demo=1: ensaio sem abrir a urna (contagem fictícia de 12 minutos)
if(new URLSearchParams(location.search).get('demo')==='1'){ urnaAberta=true; fecha=Date.now()+12*60000; }
else { cfg(); setInterval(cfg, 30000); }
function devoAparecer(){
  if(!urnaAberta||!fecha) return false;
  var d=fecha-Date.now();
  return d>0 && d<=JANELA_MIN*60*1000;
}
setInterval(function(){
  var d=fecha?Math.max(0,fecha-Date.now()):0;
  var m=Math.floor(d/60000), s=Math.floor(d/1000)%60;
  document.getElementById('conta').textContent=m+':'+(s<10?'0':'')+s;
},250);
// fora da janela, a cena pede ao giro para pular
(function(){
  var f=window.frameElement, avisou=false;
  if(!f) return;
  setInterval(function(){
    var on=f.classList.contains('on');
    if(on && !devoAparecer()){
      if(!avisou){ avisou=true; try{ window.parent.postMessage('wlr-pular','*'); }catch(e){} }
    } else if(!on){ avisou=false; }
  },400);
})();
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<40;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(255,255,255,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="qr-fixo.js"></script>
</body>
</html>
