<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O Veredicto — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#411A39;--wine-md:#4F1D45;--wine-lt:#6C214C;--cream:#FFFFFF;--rosa:#E9C9DA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.mf{text-align:center;padding-top:20px}
.mf-logo{height:clamp(125px,17vh,190px);width:auto;display:block;margin:0 auto}
.mf-filete{width:120px;height:1.5px;background:var(--rosa);margin:12px auto 10px}
.mf-cena{font-weight:600;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--cream)}
.exemplo{display:inline-block;margin-top:8px;padding:4px 14px;border:1px solid var(--rosa);color:var(--rosa);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.palco{position:absolute;inset:215px 3vw 30px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:clamp(14px,1.6vw,26px)}
.cat{border:1px solid rgba(255,255,255,.4);background:rgba(0,0,0,.18);padding:clamp(14px,1.6vh,24px) clamp(16px,1.6vw,26px);display:flex;flex-direction:column;min-height:0}
.cat h2{font-size:clamp(13px,1.15vw,19px);letter-spacing:5px;text-transform:uppercase;color:var(--rosa);font-weight:700;margin-bottom:10px}
.camp{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:4px}
.camp .vn{font-weight:800;font-size:clamp(20px,1.9vw,32px);line-height:1.2}
.camp .vn small{font-weight:300;color:var(--rosa);font-size:.82em}
.camp .vt{font-weight:300;font-size:clamp(20px,1.9vw,32px);color:var(--cream)}
.camp .quem{width:100%;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(15px,1.3vw,21px);color:rgba(255,255,255,.9)}
.resto{margin-top:10px;flex:1;min-height:0;display:flex;flex-direction:column;gap:7px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px}
.row .lb{width:46%;font-size:clamp(11px,1vw,16px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.88)}
.row .trilho{flex:1;height:clamp(10px,1.2vh,16px);background:rgba(255,255,255,.08)}
.row .barra{display:block;height:100%;background:linear-gradient(90deg,var(--rosa),var(--cream));width:0;transition:width 1s cubic-bezier(.2,.7,.3,1)}
.row .vl{width:34px;font-weight:300;font-size:clamp(13px,1.2vw,19px);color:var(--cream);text-align:right}
.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,2.4vw,34px);color:rgba(255,255,255,.85);text-align:center;padding:0 10vw}
.hidden{display:none!important}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="mf">
  <img class="mf-logo" src="img/magnumfest-logo-branca.png" alt="Magnum Fest Licínio Dias">
  <div class="mf-filete"></div>
  <div class="mf-cena">O veredicto dos confrades</div>
  <div class="exemplo hidden" id="exemplo">Exemplo · votos fictícios</div>
</div>
<div class="palco" id="palco"></div>
<div class="aviso hidden" id="aviso"></div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var P = new URLSearchParams(location.search);
var TOKEN = P.get('t') || localStorage.getItem('wlr_admin_token') || '';
var DEMO = P.get('demo') === '1';
var ORDEM = ['Melhor Vinho', 'Melhor Tinto', 'Melhor Branco', 'Melhor Espumante'];
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function rpc(fn, args) {
  return fetch(SB + '/rest/v1/rpc/' + fn, { method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(args || {}) })
    .then(function (r) { return r.json().then(function (d) { if (!r.ok) throw new Error((d && d.message) || 'erro'); return d; }); });
}
function aviso(t){ var a=document.getElementById('aviso'); a.textContent=t; a.classList.toggle('hidden', !t); }
function monta(rows){
  var cats={}, ordem=[];
  (rows||[]).forEach(function(r){
    if(!cats[r.categoria]){cats[r.categoria]=[];ordem.push(r.categoria);}
    cats[r.categoria].push(r);
  });
  ordem.sort(function(a,b){
    var ia=ORDEM.indexOf(a), ib=ORDEM.indexOf(b);
    return (ia<0?99:ia)-(ib<0?99:ib);
  });
  if(!ordem.length){ document.getElementById('palco').innerHTML=''; aviso('A urna ainda não recebeu votos.'); return; }
  aviso('');
  var palco=document.getElementById('palco');
  palco.innerHTML=ordem.slice(0,4).map(function(cat){
    var lista=cats[cat].slice().sort(function(a,b){return Number(b.votos)-Number(a.votos);});
    var max=Number(lista[0].votos)||1;
    var campeoes=lista.filter(function(r){return Number(r.votos)===max;});
    var resto=lista.filter(function(r){return Number(r.votos)<max;}).slice(0,5);
    var empate=campeoes.length>1;
    return '<div class="cat"><h2>'+esc(cat)+(empate?' · Empate':'')+'</h2>'+
      campeoes.map(function(c){
        var v=Number(c.votos);
        return '<div class="camp"><span class="vn">'+esc(c.vinho)+(c.safra?' <small>'+esc(c.safra)+'</small>':'')+'</span>'+
          '<span class="vt">'+v+' voto'+(v===1?'':'s')+'</span>'+
          '<span class="quem">'+esc((c.membros||[]).join(' · '))+'</span></div>';
      }).join('')+
      '<div class="resto">'+resto.map(function(r){
        var pct=Math.max(6,Math.round(Number(r.votos)/max*100));
        return '<div class="row"><span class="lb">'+esc(r.vinho)+(r.safra?' '+esc(r.safra):'')+'</span>'+
          '<span class="trilho"><span class="barra" data-w="'+pct+'"></span></span>'+
          '<span class="vl">'+r.votos+'</span></div>';
      }).join('')+'</div></div>';
  }).join('');
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    [].forEach.call(document.querySelectorAll('.barra'),function(b){b.style.width=b.getAttribute('data-w')+'%';});
  });});
}
var assinatura='';
function carrega(){
  rpc('wlr_admin_resultados', { p_token: TOKEN })
  .then(function(rows){ var a=JSON.stringify(rows); if(a!==assinatura){ assinatura=a; monta(rows); } })
  .catch(function(){ aviso('Abra pelo telão giratório (telao-giro.html) com o token do organizador.'); });
}
// ?demo=1: ensaio com os vinhos REAIS da carta e votos sorteados (aparece o selo "Exemplo")
function demo(){
  document.getElementById('exemplo').classList.remove('hidden');
  rpc('wlr_revelacao_vinhos', { p_token: TOKEN }).then(function(vinhos){
    var rows=[];
    ORDEM.forEach(function(cat){
      var tipo={'Melhor Tinto':'Tinto','Melhor Branco':'Branco','Melhor Espumante':'Espumante'}[cat];
      var cands=(vinhos||[]).filter(function(g){return !tipo||g.tipo===tipo;}).slice().sort(function(){return Math.random()-.5;}).slice(0,6);
      cands.forEach(function(g,i){ rows.push({categoria:cat, vinho:g.vinho, safra:g.safra, membros:g.membros, votos:Math.max(1,14-i*2-Math.floor(Math.random()*2))}); });
    });
    monta(rows);
  }).catch(function(){ aviso('Abra pelo telão giratório (telao-giro.html) com o token do organizador.'); });
}
if(!TOKEN) aviso('Abra pelo telão giratório (telao-giro.html) com o token do organizador.');
else if(DEMO) demo();
else { carrega(); setInterval(carrega, 30000); }
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<36;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(255,255,255,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="qr-fixo.js"></script>
<script>document.addEventListener("click",function(){var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){})});</script>
</body>
</html>
