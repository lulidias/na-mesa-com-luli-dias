<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Gráficos — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#411A39;--wine-md:#4F1D45;--wine-lt:#6C214C;--cream:#FFFFFF;--rosa:#E9C9DA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif}
.mf{text-align:center;padding-top:22px}
.mf-logo{height:clamp(76px,10vh,110px);width:auto;display:block;margin:0 auto}
.mf-filete{width:120px;height:1.5px;background:var(--rosa);margin:12px auto 10px}
.mf-cena{font-weight:600;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--cream)}
.palco{position:absolute;inset:220px 8vw 50px}
.lamina{position:absolute;inset:0;visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.lamina.on{visibility:visible}
.lamina h2{font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;font-size:clamp(36px,3.6vw,58px);text-align:center;margin-bottom:30px;color:var(--rosa)}
.row{display:flex;align-items:center;gap:22px;margin:13px 0}
.row .lb{width:30%;text-align:right;font-weight:600;font-size:clamp(22px,2vw,36px);letter-spacing:1px}
.row .trilho{flex:1;height:clamp(28px,3vh,44px);position:relative;background:rgba(255,255,255,.08)}
.row .barra{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--rosa),var(--cream));width:0}
.lamina.on .barra{animation:cresce 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes cresce{to{width:var(--w)}}
.row .vl{width:90px;font-weight:300;font-size:clamp(30px,3vw,50px);color:var(--cream);font-variant-numeric:tabular-nums}
/* safra: colunas */
.cols{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1vw,18px);height:56vh}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.col .cv{font-weight:300;font-size:clamp(20px,1.8vw,30px);color:var(--cream);margin-bottom:6px}
.col .cb{width:clamp(34px,3.4vw,62px);background:linear-gradient(180deg,var(--cream),var(--rosa));height:0}
.lamina.on .cb{animation:sobe 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes sobe{to{height:var(--h)}}
.col .cl{font-weight:600;font-size:clamp(15px,1.3vw,22px);margin-top:10px;letter-spacing:1px;color:var(--rosa)}
.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--rosa);text-align:center;padding:0 10vw}
.hidden{display:none!important}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="mf">
  <img class="mf-logo" src="img/magnumfest-logo-branca.png" alt="Magnum Fest Licínio Dias">
  <div class="mf-filete"></div>
  <div class="mf-cena">A carta em gráficos</div>
</div>
<div class="palco" id="palco"></div>
<div class="aviso hidden" id="aviso">Abra pelo telão giratório (telao-giro.html) com o token do organizador.</div>
<canvas id="poeira"></canvas>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var P = new URLSearchParams(location.search);
var TOKEN = P.get('t') || localStorage.getItem('wlr_admin_token') || '';
var FLAGS = { 'França': '🇫🇷', 'Itália': '🇮🇹', 'Espanha': '🇪🇸', 'Portugal': '🇵🇹', 'Chile': '🇨🇱', 'Argentina': '🇦🇷', 'Brasil': '🇧🇷', 'Uruguai': '🇺🇾', 'Estados Unidos': '🇺🇸', 'EUA': '🇺🇸', 'Alemanha': '🇩🇪', 'África do Sul': '🇿🇦', 'Austrália': '🇦🇺', 'Hungria': '🇭🇺' };
var TROCA = Number(P.get('dur')) || 7;
var MAX_LINHAS = 7;   // barras que cabem na tela; o resto vira "Outros"
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function conta(vinhos, campo){
  var m={};
  vinhos.forEach(function(g){var k=g[campo]; if(k==null||String(k).trim()==='') return; k=String(k).trim(); m[k]=(m[k]||0)+1;});
  return Object.keys(m).map(function(k){return [k, m[k]];}).sort(function(a,b){return b[1]-a[1];});
}
function corta(dados){
  if(dados.length<=MAX_LINHAS) return dados;
  var top=dados.slice(0,MAX_LINHAS-1);
  var resto=dados.slice(MAX_LINHAS-1).reduce(function(s,d){return s+d[1];},0);
  return top.concat([['Outros', resto]]);
}
function laminaBarras(titulo, dados, flags){
  if(dados.length<2) return null;   // uma barra só (ex.: tudo Magnum) não é gráfico
  dados=corta(dados);
  var max=Math.max.apply(null,dados.map(function(d){return d[1];}));
  return '<h2>'+titulo+'</h2>'+dados.map(function(d){
    var pct=Math.round(d[1]/max*100);
    return '<div class="row"><div class="lb">'+(flags?(FLAGS[d[0]]||'')+' ':'')+esc(d[0])+'</div>'+
      '<div class="trilho"><div class="barra" style="--w:'+pct+'%"></div></div>'+
      '<div class="vl">'+d[1]+'</div></div>';
  }).join('');
}
function laminaSafras(dados){
  if(!dados.length) return null;
  dados=dados.slice().sort(function(a,b){
    var na=Number(a[0]), nb=Number(b[0]);   // NV, MV19 e afins vão para o fim
    if(isNaN(na)&&isNaN(nb)) return a[0]<b[0]?-1:1;
    if(isNaN(na)) return 1; if(isNaN(nb)) return -1;
    return na-nb;
  });
  var max=Math.max.apply(null,dados.map(function(d){return d[1];}));
  return '<h2>As safras da mesa</h2><div class="cols">'+dados.map(function(d){
    var pct=Math.round(d[1]/max*88)+8;
    return '<div class="col"><div class="cv">'+d[1]+'</div><div class="cb" style="--h:'+pct+'%"></div><div class="cl">'+esc(d[0])+'</div></div>';
  }).join('')+'</div>';
}
var atual=0, flipTimer=null;
function montar(vinhos){
  var safras={};
  vinhos.forEach(function(g){var s=g.safra&&String(g.safra).trim()?String(g.safra).trim():'NV'; safras[s]=(safras[s]||0)+1;});
  var laminas=[
    laminaBarras('A carta por estilo', conta(vinhos,'tipo')),
    laminaBarras('Os formatos das garrafas', conta(vinhos,'formato')),
    laminaBarras('A disputa das nações', conta(vinhos,'pais'), true),
    laminaBarras('As regiões na taça', conta(vinhos,'regiao')),
    laminaSafras(Object.keys(safras).map(function(k){return [k, safras[k]];}))
  ].filter(Boolean);
  var palco=document.getElementById('palco'); palco.innerHTML='';
  if(!laminas.length) return;
  laminas.forEach(function(html,ix){
    var el=document.createElement('div'); el.className='lamina'; el.id='lam'+ix;
    el.innerHTML=html; palco.appendChild(el);
  });
  atual=0;
  document.getElementById('lam0').classList.add('on');
  if(flipTimer) clearInterval(flipTimer);
  flipTimer=setInterval(function(){
    document.getElementById('lam'+atual).classList.remove('on');
    atual=(atual+1)%laminas.length;
    document.getElementById('lam'+atual).classList.add('on');
  },TROCA*1000);
}
function carrega(){
  fetch(SB+'/rest/v1/rpc/wlr_telao_vinhos',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){if(!r.ok) throw 0; return r.json();})
  .then(function(v){ montar(v||[]); })
  .catch(function(){ document.getElementById('aviso').classList.remove('hidden'); });
}
if(TOKEN){ carrega(); setInterval(carrega, 180000); }
else document.getElementById('aviso').classList.remove('hidden');
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<36;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(255,255,255,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="qr-fixo.js"></script>
</body>
</html>
