<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Vitrine — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#411A39;--wine-lt:#6C214C;--rosa:#E9C9DA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#fff;font-family:'Montserrat',sans-serif}
.palco{position:absolute;inset:0;background:#fff;padding:14px 16px;border-bottom:8px solid var(--wine-lt)}
.pagina{position:absolute;inset:10px 12px 18px;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:1fr 1fr;gap:4px 8px;visibility:hidden}
.pagina.on{visibility:visible}
.pagina.on .card{opacity:0;animation:pop .65s cubic-bezier(.2,.7,.3,1) both}
.pagina.on .card:nth-child(1){animation-delay:0.05s}
.pagina.on .card:nth-child(2){animation-delay:0.10s}
.pagina.on .card:nth-child(3){animation-delay:0.15s}
.pagina.on .card:nth-child(4){animation-delay:0.20s}
.pagina.on .card:nth-child(5){animation-delay:0.25s}
.pagina.on .card:nth-child(6){animation-delay:0.30s}
.pagina.on .card:nth-child(7){animation-delay:0.35s}
.pagina.on .card:nth-child(8){animation-delay:0.40s}
.pagina.on .card:nth-child(9){animation-delay:0.45s}
.pagina.on .card:nth-child(10){animation-delay:0.50s}
.pagina.on .card:nth-child(11){animation-delay:0.55s}
.pagina.on .card:nth-child(12){animation-delay:0.60s}
.pagina.on .card:nth-child(13){animation-delay:0.65s}
.pagina.on .card:nth-child(14){animation-delay:0.70s}
.pagina.on .card:nth-child(15){animation-delay:0.75s}
.pagina.on .card:nth-child(16){animation-delay:0.80s}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.96)}to{opacity:1;transform:none}}
.card{display:flex;flex-direction:column;min-height:0}
.fig{flex:1;display:flex;align-items:flex-end;justify-content:center;min-height:0}
.fig img{max-height:100%;max-width:100%;object-fit:contain}
.nm{font-weight:700;font-size:clamp(12px,.95vw,17px);color:var(--wine);text-align:center;line-height:1.18;margin-top:5px;height:2.4em;overflow:hidden}
.nm .sf{font-weight:400;color:var(--wine-lt);white-space:nowrap}
.semfoto{margin:0 auto;opacity:.8}
.aviso{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:30px;color:var(--wine-lt);text-align:center;padding:0 10vw}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="palco" id="palco"></div>
<div class="aviso hidden" id="aviso">Abra pelo telão giratório (telao-giro.html) com o token do organizador.</div>

<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var P = new URLSearchParams(location.search);
var TOKEN = P.get('t') || localStorage.getItem('wlr_admin_token') || '';
var POR_PAGINA = 16;
var COM_NOMES = !P.has('semnomes');
var TROCA = Number(P.get('dur')) || 7; // segundos por página
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var GARRAFA_SVG='<svg class="semfoto" viewBox="0 0 60 200" width="54" height="180"><path d="M24 8h12v38c0 10 10 16 10 30v108a8 8 0 0 1-8 8H22a8 8 0 0 1-8-8V76c0-14 10-20 10-30z" fill="none" stroke="#6C214C" stroke-width="2.5"/><rect x="17" y="104" width="26" height="44" fill="none" stroke="#411A39" stroke-width="1.5"/></svg>';

var atualPg = 0, flipTimer = null, assinatura = '';
function montar(vinhos){
  var palco=document.getElementById('palco'); palco.innerHTML='';
  if(!vinhos.length) return;
  // reparte por igual: 20 garrafas = 2 páginas de 10 (garrafas maiores), nunca uma página quase só de repetidas
  var nPag=Math.ceil(vinhos.length/POR_PAGINA);
  var porPag=Math.ceil(vinhos.length/nPag);
  var cols=Math.max(4,Math.ceil(porPag/2));
  var paginas=[];
  for(var i=0;i<vinhos.length;i+=porPag) paginas.push(vinhos.slice(i,i+porPag));
  // completa a última página repetindo do começo (a grade nunca fica com buraco)
  var ultima=paginas[paginas.length-1];
  var k=0;
  while(ultima && ultima.length<porPag && paginas.length>1) ultima.push(vinhos[k++ % vinhos.length]);
  paginas.forEach(function(pg,ix){
    var el=document.createElement('div'); el.className='pagina'; el.id='pg'+ix;
    el.style.gridTemplateColumns='repeat('+cols+',1fr)';
    el.innerHTML=pg.map(function(g){
      return '<div class="card"><div class="fig">'+
        (g.foto_url?'<img src="'+esc(g.foto_url)+'">':GARRAFA_SVG)+
        '</div>'+(COM_NOMES?'<div class="nm">'+esc(g.vinho)+(g.safra?' <span class="sf">'+esc(g.safra)+'</span>':'')+'</div>':'')+
      '</div>';
    }).join('');
    palco.appendChild(el);
  });
  atualPg=0;
  document.getElementById('pg0').classList.add('on');
  if(flipTimer) clearInterval(flipTimer);
  if(paginas.length>1) flipTimer=setInterval(function(){
    document.getElementById('pg'+atualPg).classList.remove('on');
    atualPg=(atualPg+1)%paginas.length;
    document.getElementById('pg'+atualPg).classList.add('on');
  },TROCA*1000);
}
function carrega(){
  fetch(SB+'/rest/v1/rpc/wlr_telao_vinhos',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:TOKEN})})
  .then(function(r){if(!r.ok) throw 0; return r.json();})
  .then(function(vinhos){
    vinhos=vinhos||[];
    var a=JSON.stringify(vinhos);
    if(a===assinatura) return;
    assinatura=a;
    montar(vinhos);
  }).catch(function(){ if(!assinatura) document.getElementById('aviso').classList.remove('hidden'); });
}
if(TOKEN){ carrega(); setInterval(carrega,120000); }
else document.getElementById('aviso').classList.remove('hidden');
</script>
<script src="qr-fixo.js"></script>
</body>
</html>
