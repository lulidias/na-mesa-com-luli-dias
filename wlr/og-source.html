<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Montserrat:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:'Montserrat',sans-serif;background:radial-gradient(130% 160% at 50% -20%,#6C214C 0%,#411A39 45%,#2E1029 100%);color:#F7F0EC;position:relative}
body::after{content:'';position:absolute;inset:16px;border:1px solid rgba(217,180,106,.45)}
.wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:70px;padding:0 80px}
.logo{width:360px;height:auto}
.sep{width:1px;height:330px;background:linear-gradient(transparent,rgba(217,180,106,.7),transparent)}
.txt{text-align:left}
.k{font-size:17px;letter-spacing:7px;color:#D9B46A;font-weight:500}
h1{font-weight:800;font-size:88px;letter-spacing:3px;line-height:1;margin-top:18px}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:50px;color:#E2B0C8;margin-top:8px}
.when{font-size:26px;font-weight:700;margin-top:34px;letter-spacing:1px}
.when b{color:#D9B46A;font-weight:300;padding:0 10px}
.onde{font-size:17px;font-weight:500;letter-spacing:2px;white-space:nowrap;color:rgba(247,240,236,.8);margin-top:10px;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="img/logo-claro.png">
  <div class="sep"></div>
  <div class="txt">
    <div class="k">WINE LOVERS RECIFE APRESENTA</div>
    <h1>MAGNUM FEST</h1>
    <div class="sub">Licínio Dias · 2026</div>
    <div class="when">11 de dezembro<b>·</b>Recife</div>
    <div class="onde">Restaurante Ruizito · Shopping RioMar</div>
  </div>
</div>
</body>
</html>
