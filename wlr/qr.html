<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Votação — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500&family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#FFFFFF;color:#411A39;font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:4vh 24px;gap:2.2vh;border-bottom:12px solid #6C214C}
body::before{content:'';position:fixed;inset:14px;border:1px solid rgba(108,33,76,.3);pointer-events:none}
.logo{width:min(300px,50vw);height:auto}
h1{font-weight:800;font-size:clamp(34px,6vw,72px);letter-spacing:.05em;line-height:1}
.sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(22px,3.4vw,40px);color:#6C214C}
.chamada{font-weight:800;font-size:clamp(18px,2.6vw,30px);letter-spacing:3px;text-transform:uppercase;margin-top:1vh}
#qr{width:min(46vh,70vw);height:auto;border:10px solid #fff;outline:2px solid #6C214C}
.url{font-weight:600;font-size:clamp(14px,1.8vw,22px);letter-spacing:1px;color:#6C214C}
.idiomas{font-size:clamp(12px,1.4vw,16px);color:#6B5E65;line-height:1.7}
@media print{body{border-bottom:none}body::before{display:none}}
</style>
</head>
<body data-sem-seletor>
  <img class="logo" src="img/logo.png" alt="Wine Lovers Recife">
  <h1>MAGNUM FEST</h1>
  <div class="sub">Licínio Dias · 2026</div>
  <div class="chamada">Vote nos melhores vinhos da noite</div>
  <canvas id="qr" width="600" height="600"></canvas>
  <div class="url" id="url"></div>
  <div class="idiomas" data-notr>Aponte a câmera do celular para o QR Code<br>
    Apunta la cámara del móvil al código QR · Point your phone's camera at the QR code</div>
<script src="i18n.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
var alvo = location.origin + location.pathname.replace(/[^/]*$/, '') + 'votar/';
document.getElementById('url').textContent = alvo.replace(/^https?:\/\//, '');
new QRious({ element: document.getElementById('qr'), value: alvo, size: 600, background: '#FFFFFF', foreground: '#411A39', level: 'M' });
</script>
</body>
</html>
