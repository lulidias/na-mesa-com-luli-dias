<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<title>Placa — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@200;300;400;500;600;800&display=swap" rel="stylesheet">
<style>
/* Placa 15×20 cm — pronta antes da festa: só marca, categoria, colocação e ano (Luli, 24/11/2026).
   ?cat=vinho|tinto|branco|espumante  &pos=1|2|3 */
@page{size:150mm 200mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:150mm;height:200mm}
body{background:#411A39;color:#FFFFFF;font-family:'Montserrat',Helvetica,sans-serif;position:relative;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.frame{position:absolute;inset:5mm;border:0.6mm solid #FFFFFF}
.frame2{position:absolute;inset:8mm;border:0.2mm solid rgba(255,255,255,.6)}
.inner{position:absolute;inset:8mm;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;padding:12mm 0 10mm}
.logo{width:70mm;height:auto;display:block}
.meio{display:flex;flex-direction:column;align-items:center}
.melhor{font-size:5mm;letter-spacing:3mm;padding-left:3mm;font-weight:500}
.categoria{font-weight:800;font-size:14mm;letter-spacing:1.8mm;padding-left:1.8mm;line-height:1.05;margin-top:2.5mm}
.categoria.longa{font-size:11mm;letter-spacing:1.2mm;padding-left:1.2mm}
.rule{width:40mm;height:0.25mm;background:#FFFFFF;opacity:.7;margin:7mm auto 6mm}
.pos{display:flex;align-items:flex-start;justify-content:center;line-height:.85}
.pos .n{font-weight:500;font-size:30mm}
.pos .o{font-weight:500;font-size:10mm;margin-top:1.5mm;text-decoration:underline;text-underline-offset:1.6mm;text-decoration-thickness:.5mm}
.lugar{font-size:5mm;letter-spacing:3.4mm;padding-left:3.4mm;font-weight:500;margin-top:4mm}
.rodape{display:flex;flex-direction:column;align-items:center}
.ano{font-weight:300;font-size:8mm;letter-spacing:4mm;padding-left:4mm}
.diamond{width:2.4mm;height:2.4mm;background:#FFFFFF;transform:rotate(45deg);margin-top:4mm}
</style>
</head>
<body>
<div class="frame"></div>
<div class="frame2"></div>
<div class="inner">
  <img class="logo" src="img/magnumfest-logo-branca.png" alt="Magnum Fest Licínio Dias">
  <div class="meio">
    <div class="melhor">MELHOR</div>
    <div class="categoria" id="categoria">VINHO</div>
    <div class="rule"></div>
    <div class="pos"><span class="n" id="n">1</span><span class="o">o</span></div>
    <div class="lugar">LUGAR</div>
  </div>
  <div class="rodape">
    <div class="ano">2026</div>
    <div class="diamond"></div>
  </div>
</div>
<script>
var CATS = {
  vinho: { txt: 'VINHO' }, festa: { txt: 'VINHO' },
  tinto: { txt: 'TINTO' }, branco: { txt: 'BRANCO' },
  espumante: { txt: 'ESPUMANTE', longa: true }
};
var p = new URLSearchParams(location.search);
var c = CATS[p.get('cat')] || CATS.vinho;
var el = document.getElementById('categoria');
el.textContent = c.txt; if (c.longa) el.classList.add('longa');
var pos = String(p.get('pos') || '1').replace(/\D/g, '') || '1';
document.getElementById('n').textContent = pos;
document.title = 'Placa ' + pos + 'º lugar · Melhor ' + c.txt.charAt(0) + c.txt.slice(1).toLowerCase() + ' — Magnum Fest 2026';
</script>
</body>
</html>
