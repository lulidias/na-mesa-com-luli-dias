<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<title>Placa — Magnum Fest Licínio Dias 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@0;1&family=Montserrat:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
@page{size:150mm 200mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:150mm;height:200mm}
body{background:#411A39;color:#FFFFFF;font-family:'Montserrat',Helvetica,sans-serif;position:relative;overflow:hidden}
.frame{position:absolute;inset:5mm;border:0.6mm solid #FFFFFF}
.frame2{position:absolute;inset:8mm;border:0.2mm solid rgba(255,255,255,.65)}
.inner{position:absolute;inset:0;text-align:center;padding-top:13mm}
.emblema{width:30mm;height:30mm;display:block;margin:0 auto 4mm}
.marca{font-family:'Montserrat',Helvetica,sans-serif;font-weight:800;font-size:9mm;letter-spacing:1.4mm;padding-left:1.4mm;color:#FFFFFF}
.sub{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:6mm;color:rgba(255,255,255,.78);margin-top:1mm}
.rule{width:52mm;height:0.25mm;background:#FFFFFF;opacity:.75;margin:5mm auto}
.melhor{font-size:4.2mm;letter-spacing:2.4mm;padding-left:2.4mm;color:#FFFFFF;font-weight:500}
.categoria{font-family:'Montserrat',Helvetica,sans-serif;font-weight:800;font-size:13mm;letter-spacing:1.6mm;line-height:1.12;margin-top:4mm;color:#FFFFFF}
.categoria.longa{font-size:11mm}
.icone{margin:3.5mm auto 0;height:7mm}
.gravacao{margin-top:5mm}
.grav-label{font-size:2.8mm;letter-spacing:1.6mm;color:rgba(255,255,255,.9)}
.grav-linha{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:6mm;color:rgba(255,255,255,.45);border-bottom:0.2mm solid rgba(255,255,255,.55);width:92mm;margin:1mm auto 4mm;padding-bottom:1mm}
.rodape{position:absolute;bottom:10mm;left:0;right:0;text-align:center}
.rodape .data{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:4.4mm;color:rgba(255,255,255,.85)}
.rodape .ano{font-family:'Montserrat',sans-serif;font-weight:300;font-size:6.5mm;letter-spacing:3mm;padding-left:3mm;color:#FFFFFF;margin-top:2mm}
.diamond{width:2.2mm;height:2.2mm;background:#FFFFFF;transform:rotate(45deg);margin:3mm auto 0}
</style>
</head>
<body>
<div class="frame"></div>
<div class="frame2"></div>
<div class="inner">
  <img src="img/logo-branco.png" alt="Wine Lovers Recife" style="width:52mm;height:auto;display:block;margin:0 auto 5mm">
  <div class="marca">MAGNUM FEST</div>
  <div class="sub">Licínio Dias</div>
  <div class="rule"></div>
  <div class="melhor">MELHOR</div>
  <div class="categoria" id="categoria">TINTO</div>
  <svg class="icone" id="icone" viewBox="0 0 40 16" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="gravacao">
    <div class="grav-label">VINHO VENCEDOR</div>
    <div class="grav-linha" id="l-vinho">&nbsp;</div>
    <div class="grav-label">CONFRADE</div>
    <div class="grav-linha" id="l-confrade">&nbsp;</div>
  </div>
</div>
<div class="rodape">
  <div class="data">Recife · 11 de dezembro de 2026 · Restaurante Ruizito</div>
  <div class="ano">2026</div>
  <div class="diamond"></div>
</div>
<script>
var CATS = {
  'festa':     { txt: 'VINHO',  icone: '<path d="M20 1 L22.4 6.6 L28 6.6 L23.6 10.2 L25.2 15.8 L20 12.2 L14.8 15.8 L16.4 10.2 L12 6.6 L17.6 6.6 Z" fill="#FFFFFF"/>' },
  'tinto':     { txt: 'TINTO' },
  'branco':    { txt: 'BRANCO' },
  'rose':      { txt: 'ROSÉ' },
  'doce':      { txt: 'PORTO &amp;<br>DOCES', longa: true },
  'espumante': { txt: 'ESPUMANTE', longa: true }
};
var p = new URLSearchParams(location.search);
var c = CATS[p.get('cat')] || CATS['tinto'];
document.getElementById('categoria').innerHTML = c.txt;
document.getElementById('categoria').className = 'categoria' + (c.longa ? ' longa' : '');
if (c.icone) { document.getElementById('icone').innerHTML = c.icone; }
else { document.getElementById('icone').style.display = 'none'; }
if (p.get('vinho')) { document.getElementById('l-vinho').textContent = p.get('vinho'); document.getElementById('l-vinho').style.color = '#FFFFFF'; }
if (p.get('confrade')) { document.getElementById('l-confrade').textContent = p.get('confrade'); document.getElementById('l-confrade').style.color = '#FFFFFF'; }
</script>
</body>
</html>
