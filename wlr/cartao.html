<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu cartão — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#411A39;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px;font-family:'Montserrat',sans-serif}
canvas{max-width:min(92vw,460px);height:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{padding:14px 30px;background:#6C214C;color:#fff;border:none;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;cursor:pointer}
.btn.ghost{background:none;border:1px solid rgba(255,255,255,.6);color:#FFFFFF}
.aviso{color:rgba(255,255,255,.6);font-size:11px;text-align:center;max-width:420px;line-height:1.6}
body.foto{padding:0;gap:0}
body.foto .acoes,body.foto .aviso{display:none}
body.foto canvas{max-width:none;width:1080px;box-shadow:none}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1350"></canvas>
<div class="acoes">
  <button class="btn" id="b-share" onclick="compartilhar()">📲 Compartilhar</button>
  <button class="btn" id="b-copy" onclick="copiar()">📋 Copiar imagem</button>
  <button class="btn ghost" onclick="baixar()">Baixar</button>
</div>
<p class="aviso" id="aviso">Poste no grupo da Wine Lovers e chame os confrades para a mesa. 🥂</p>
<div id="toast" style="position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:#2E7D4F;color:#fff;padding:13px 26px;font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .3s;pointer-events:none">Imagem copiada!</div>

<script src="i18n.js"></script>
<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
var params = new URLSearchParams(location.search);
if (params.get('foto')) document.body.classList.add('foto');
var meuId = params.get('id') || localStorage.getItem('wlr_id');
// em desktop a folha de compartilhar raramente tem WhatsApp — o caminho é Copiar
window.addEventListener('DOMContentLoaded', function () {
  var mobile = /iPhone|iPad|Android/i.test(navigator.userAgent);
  if (!mobile) {
    document.getElementById('b-share').style.display = 'none';
    document.getElementById('aviso').textContent = 'Clique em Copiar imagem e cole (Cmd+V) direto na conversa do WhatsApp. 🥂';
  }
});

function rpc(fn, args) {
  return fetch(SB + '/rest/v1/rpc/' + fn, {
    method: 'POST', headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify(args || {})
  }).then(function (r) { return r.json(); });
}

var LOGO = new Image(); LOGO.src = 'img/magnumfest-logo.png';
function desenha(nome) {
  var c = document.getElementById('c'), x = c.getContext('2d');
  var W = 1080, H = 1350, CX = W / 2;
  x.fillStyle = '#FFFFFF'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#6C214C'; x.fillRect(0, H - 22, W, 22);
  x.strokeStyle = '#6C214C'; x.lineWidth = 4; x.strokeRect(36, 36, W - 72, H - 72);
  x.strokeStyle = 'rgba(108,33,76,.35)'; x.lineWidth = 1.5; x.strokeRect(58, 58, W - 116, H - 116);
  x.textAlign = 'center';
  // logo da confraria
  // a logo da Magnum Fest (garrafa, taça e o nome) e o ano
  // a marca: Wine Lovers em cima, MAGNUM FEST e Licínio Dias embaixo
  if (LOGO.complete && LOGO.naturalWidth) { var lw = 720, lh = lw * LOGO.naturalHeight / LOGO.naturalWidth; x.drawImage(LOGO, CX - lw / 2, 110, lw, lh); }
  x.fillStyle = '#6C214C'; x.font = '500 44px Montserrat';
  try { x.letterSpacing = '14px'; } catch (e) { }
  x.fillText('2026', CX + 7, 572);
  try { x.letterSpacing = '0px'; } catch (e) { }
  x.strokeStyle = 'rgba(108,33,76,.6)'; x.lineWidth = 2;
  x.beginPath(); x.moveTo(CX - 140, 618); x.lineTo(CX + 140, 618); x.stroke();
  // o destaque do cartão
  x.fillStyle = '#6C214C'; x.font = 'italic 600 176px "Cormorant Garamond", Georgia, serif';
  x.fillText(T('Eu vou!'), CX, 790);
  x.fillStyle = '#411A39';
  var tam = 88; x.font = '700 ' + tam + 'px Montserrat';
  while (x.measureText(nome).width > 900 && tam > 50) { tam -= 6; x.font = '700 ' + tam + 'px Montserrat'; }
  x.fillText(nome, CX, 930);
  x.fillStyle = '#6C214C'; x.font = '600 34px Montserrat';
  try { x.letterSpacing = '6px'; } catch (e) { }
  x.fillText(DATA_TXT, CX, 1060);
  x.fillStyle = '#6B5E65'; x.font = '500 28px Montserrat';
  try { x.letterSpacing = '4px'; } catch (e) { }
  x.fillText(LOCAL_TXT, CX, 1112);
  try { x.letterSpacing = '0px'; } catch (e) { }
  x.fillStyle = '#6C214C'; x.font = '600 26px Montserrat';
  try { x.letterSpacing = '5px'; } catch (e) { }
  x.fillText(location.host.replace(/^www\./, '').toUpperCase() + location.pathname.replace(/[^/]*$/, '').replace(/\/$/, '').toUpperCase(), CX, 1252);
  try { x.letterSpacing = '0px'; } catch (e) { }
}
var DATA_TXT = '11 DE DEZEMBRO DE 2026', LOCAL_TXT = 'RESTAURANTE RUIZITO · RECIFE';

function avisa(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(function () { t.style.opacity = '0'; }, 3500);
}
function copiar() {
  document.getElementById('c').toBlob(function (blob) {
    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })])
        .then(function () { avisa('✓ Imagem copiada! Agora é só Cmd+V (colar) na conversa do WhatsApp.'); })
        .catch(function () { baixar(); });
    } else { baixar(); }
  });
}
function baixar() {
  var a = document.createElement('a');
  a.download = 'magnum-fest-eu-vou.png';
  a.href = document.getElementById('c').toDataURL('image/png');
  a.click();
}
function compartilhar() {
  document.getElementById('c').toBlob(function (blob) {
    var file = new File([blob], 'magnum-fest-eu-vou.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] });
    } else { baixar(); }
  });
}

Promise.all([
  document.fonts.load('800 104px Montserrat'), document.fonts.load('700 92px Montserrat'),
  document.fonts.load('italic 500 64px "Cormorant Garamond"'), document.fonts.load('italic 600 64px "Cormorant Garamond"'),
  new Promise(function (ok) { if (LOGO.complete) ok(); else { LOGO.onload = ok; LOGO.onerror = ok; } }),
  fetch(SB + '/rest/v1/wlr_config_publica?select=*', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } }).then(function (r) { return r.json(); }).then(function (rows) {
    var cfg = rows && rows[0]; if (!cfg) return;
    DATA_TXT = new Date(cfg.evento_em).toLocaleDateString(LOCALE(), { timeZone: 'America/Recife', day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
    LOCAL_TXT = [cfg.local_nome, 'RECIFE'].filter(Boolean).join(' · ').toUpperCase();
  }).catch(function () { })
]).then(function () {
  if (!meuId) { desenha(T('Confrade')); return; }
  rpc('wlr_meu', { p_id: meuId }).then(function (rows) {
    var p = rows && rows[0];
    desenha(p ? p.nome : T('Confrade'));
    document.title = 'pronto';
  });
});
</script>
</body>
</html>
