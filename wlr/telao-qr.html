<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>/* o site da festa mora em wineloversrecife.com — quem chegar pelo endereço antigo é levado para lá, com o mesmo caminho */
if (/(^|\.)lulidias\.com$/.test(location.hostname)) location.replace('https://wineloversrecife.com' + location.pathname.replace(/^\/wlr/, '') + location.search + location.hash);</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vote — Magnum Fest Licínio Dias 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.png"><link rel="apple-touch-icon" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital@1&family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#411A39;--wine-md:#4F1D45;--wine-lt:#6C214C;--cream:#FFFFFF;--rosa:#E9C9DA}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(130% 130% at 50% -20%,var(--wine-lt) 0%,var(--wine-md) 45%,var(--wine) 100%);color:var(--cream);font-family:'Montserrat',sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
.mf{text-align:center}
.mf-logo{height:clamp(84px,11vh,120px);width:auto;display:block;margin:0 auto}
.mf-filete{width:120px;height:1.5px;background:var(--rosa);margin:14px auto 12px}
.mf-cena{font-weight:600;font-size:clamp(15px,1.3vw,22px);letter-spacing:7px;text-transform:uppercase;color:var(--cream)}
.qrbox{background:#fff;border:3px solid var(--rosa);padding:30px;margin-top:34px;animation:pulsa 4s ease-in-out infinite}
.qrbox canvas{display:block;width:min(46vh,430px);height:auto}
@keyframes pulsa{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
.aponte{font-weight:700;font-size:clamp(20px,1.8vw,30px);letter-spacing:8px;text-transform:uppercase;color:var(--cream);margin-top:30px}
.prazo{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(20px,1.9vw,28px);color:var(--rosa);margin-top:10px}
#poeira{position:fixed;inset:0;pointer-events:none}
</style>
</head>
<body>
<div class="mf">
  <img class="mf-logo" src="img/magnumfest-logo-branca.png" alt="Magnum Fest Licínio Dias">
  <div class="mf-filete"></div>
  <div class="mf-cena">A Grande Votação</div>
</div>
<div class="qrbox"><canvas id="qr"></canvas></div>
<div class="aponte">Aponte a câmera e vote</div>
<div class="prazo" id="prazo">Um voto por categoria · Vinho, Tinto, Branco e Espumante</div>
<canvas id="poeira"></canvas>
<script src="https://cdn.jsdelivr.net/npm/qrious@4.0.2/dist/qrious.min.js"></script>
<script>
'use strict';
var SB = 'https://saotncritqxuchsvvnzi.supabase.co';
var KEY = 'sb_publishable_EwpsjtLlSrPhSJfrJG6Qvw_qUtE0aL5';
new QRious({ element: document.getElementById('qr'), value: 'https://wineloversrecife.com/votar/', size: 430, level: 'M', background: '#FFFFFF', foreground: '#411A39' });
// com horário de fechamento definido, a legenda diz até quando
fetch(SB + '/rest/v1/wlr_config_publica?select=urna_fecha_em', { headers: { 'apikey': KEY, 'Authorization': 'Bearer ' + KEY } })
  .then(function (r) { return r.json(); })
  .then(function (rows) {
    var f = rows && rows[0] && rows[0].urna_fecha_em;
    if (!f) return;
    var h = new Date(f).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit', timeZone: 'America/Recife' }).replace(':', 'h');
    document.getElementById('prazo').textContent = 'Um voto por categoria — a urna fecha às ' + h;
  }).catch(function () {});
(function(){
  var c=document.getElementById('poeira'),x=c.getContext('2d'),pts=[];
  function dim(){c.width=innerWidth;c.height=innerHeight;}
  dim();addEventListener('resize',dim);
  for(var i=0;i<40;i++)pts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.8+Math.random()*2.2,v:.12+Math.random()*.35,d:(Math.random()-.5)*.18,f:Math.random()*Math.PI*2});
  (function anima(){
    x.clearRect(0,0,c.width,c.height);
    pts.forEach(function(p){p.y-=p.v;p.x+=p.d;p.f+=.015;
      if(p.y<-6){p.y=c.height+6;p.x=Math.random()*c.width;}
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);
      x.fillStyle='rgba(255,255,255,'+(.1+.2*Math.abs(Math.sin(p.f)))+')';x.fill();});
    requestAnimationFrame(anima);
  })();
})();
</script>
<script src="qr-fixo.js" data-sem-qr></script>
<script>document.addEventListener("click",function(){var e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen().catch(function(){})});</script>
</body>
</html>
